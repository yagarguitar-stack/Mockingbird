/* ══════════════════════════════════════════════════════════════
   1組ぶんの問いを、先にまとめて組み立てる

   1問ずつその場で抽選すると、二つの困りごとが起きる：

     ① 同じ問いが1組の中で繰り返される
     ② 答えが偏る——10問すべて「高くなった」という組も起こり得る

   ②のほうが実害は大きい。耳を使わず「ぜんぶ高い」と答えれば
   満点になってしまうからである。

   そこで、まず答えの割り当てを均等に決め、それを混ぜてから、
   各枠に「その答えを持ち、まだ出ていない問い」を当てていく。
   ══════════════════════════════════════════════════════════════ */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ══ 同じ問いかどうか ══
   鳴る音の並びと、答えで決める。並びには次を含める：

     時刻   … 同時か、順に鳴るか
     音高   … セントのズレは音高に小数で焼き込まれているので、
              ここで一緒に拾える（79.04 と 79.00 は別物になる）
     音色   … **上級・段19 は音色そのものが問いの一部。**
              含めないと、ピアノ→ギターとギター→ピアノが
              同じ問いと見なされ、無用に弾かれる

   小数の桁は丸めて揃える。同じ計算から出た値でも、
   器によって末尾が揺れることがあるため。 */
const signOf = q =>
  q.seq.map(e=> e.t.toFixed(2) + ':' + e.m.toFixed(3) + ':' + (e.v || '')).join(',')
  + '|' + q.answer;

/* ══ 1問を引く ══
   「この枠の答えは短3」と決めてから探すが、見つからないことがある。
   その時の譲り方を、はっきり順に決めておく。**黙って無関係な答えを
   入れると、答えの配りを整えた意味がなくなる。**

     ① 同じ答えで、まだ出ていない問い          ← 本筋
     ② 同じ答えなら、重複を許す
     ③ 答えを変える。ただし重複はしない        ← ここで初めて枠を諦める
     ④ それでも駄目なら、そのまま返す

   want に null を渡せば、答えを問わず引く。 */
function drawOne(st, want, used){
  const fits = c => !want || c.answer === want;
  let c;
  for(let k=0; k<400; k++){ c = st.make(); if(fits(c) && !used.has(signOf(c))) return c; }
  for(let k=0; k<400; k++){ c = st.make(); if(fits(c)) return c; }
  for(let k=0; k<400; k++){ c = st.make(); if(!used.has(signOf(c))) return c; }
  return st.make();
}

function buildSet(st){
  /* ══ 答えの種類を先に混ぜる ══
     並び順のまま端から取ると、種類が問題数より多い段——たとえば
     答えが12種で10問——では**常に先頭の10種だけが選ばれ、
     残り2種は一度も出ない。** 混ぜてから取る。 */
  const kinds = shuffle(st.kinds.slice());
  const quota = [];
  for(let i=0;i<st.n;i++) quota.push(kinds[i % kinds.length]);
  shuffle(quota);

  const used = new Set(), out = [];
  for(const want of quota){
    const q = drawOne(st, want, used);
    used.add(signOf(q));
    out.push(q);
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════
   記録
   ══════════════════════════════════════════════════════════════ */
/* ══ 記録 ══
   コースごとに別に持つ。段の番号の意味がコースで違うため。

   best   … 最高記録。段を開くかどうかの判定に使う
   recent … 直近3回の得点率。**得意と苦手を映すのはこちら。**
            段を進むには8割（上級は9割）が要るので、最高記録だけを
            見れば進んだ段はどれも8〜10割で埋まる。それでは
            図がほぼ満杯になり、苦手も得意も見えない。 */
function readStore(course){
  try{
    const o = JSON.parse(localStorage.getItem(course.store) || '{}');
    return { open:o.open || 1, best:o.best || {}, recent:o.recent || {} };
  }catch(_){ return { open:1, best:{}, recent:{} }; }
}
function loadScore(){ return readStore(COURSE); }
function saveScore(s){ try{ localStorage.setItem(COURSE.store, JSON.stringify(s)); }catch(_){} }

function noteResult(no, ok){
  const s = loadScore(), list = COURSE.stages, st = stageByNo(list, no);
  if(!st) return s;
  if(!s.best[no] || ok > s.best[no]) s.best[no] = ok;

  /* 直近3回だけを残す。古い成績は実力を映さない */
  const r = (s.recent[no] || []).concat([ +(ok / st.n).toFixed(3) ]);
  s.recent[no] = r.slice(-3);
  const idx = list.indexOf(st);
  if(!COURSE.free && ok >= passLine(st) && s.open === no && idx + 1 < list.length)
    s.open = list[idx + 1].no;
  saveScore(s);
  return s;
}

   同時に鳴った音は同じ横位置に積み上がる。
   1つめの音の高さに点線を引く——2つめがその上か下かが、
   線をまたぐかどうかで読める。

   答え合わせのあとにのみ描く。鳴っている最中に出せば答えになる。
   ══════════════════════════════════════════════════════════════ */
/* 選択肢に添える小さな輪郭（段8） */
function shapeGlyph(iv){
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 46 26');
  svg.setAttribute('class','glyph');
  const lo = Math.min.apply(null,iv), hi = Math.max.apply(null,iv);
  const pts = iv.map((v,i)=> [6 + i*17, 21 - (v-lo)/(hi-lo) * 16]);
  const p = document.createElementNS(NS,'path');
  p.setAttribute('d', pts.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1].toFixed(1)).join(' '));
  p.setAttribute('class','glyphline');
  svg.appendChild(p);
  pts.forEach(q=>{
    const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',q[0]); c.setAttribute('cy',q[1].toFixed(1)); c.setAttribute('r',3);
    c.setAttribute('class','glyphdot'); svg.appendChild(c);
  });
  return svg;
}

/* ══════════════════════════════════════════════════════════════
   楽器えらび
   ══════════════════════════════════════════════════════════════ */
/* ══ つまみ ══
   正解の音を動かした時だけ、手を離した折に一度鳴らして聴かせる。
   動かしている最中に鳴らすと、鳴りっぱなしになる。 */
function drawVolume(){
  const pairs = [['volq','volqv','q'], ['volse','volsev','se']];
  pairs.forEach(([id, out, key])=>{
    const el = $(id), lab = $(out); if(!el || !lab) return;
    el.value = Math.round(VOL[key] * 100);
    lab.textContent = el.value + '%';
    el.oninput = ()=>{
      VOL[key] = Number(el.value) / 100;
      lab.textContent = el.value + '%';
      applyVol(); saveVol();
    };
    if(key === 'se') el.onchange = ()=> chime();
  });
}

function drawInstPicker(id){
  const box = $(id); if(!box) return;
  box.innerHTML = '';
  [['guitar','ギター'],['piano','ピアノ']].forEach(([v,label])=>{
    const b = document.createElement('button');
    b.className = 'inst' + (INST === v ? ' on' : '');
    b.type = 'button';
    b.setAttribute('aria-pressed', INST === v ? 'true' : 'false');
    b.textContent = label;
    b.onclick = ()=>{
      setInst(v);
      drawInstPicker('inst'); drawInstPicker('inst2');
      if(quiz && $('quiz').style.display !== 'none') playCurrent();
    };
    box.appendChild(b);
  });
}

/* ══════════════════════════════════════════════════════════════
   表 — 一本道として見せる
   ══════════════════════════════════════════════════════════════ */
/* 初級は白鍵基調、上級は黒鍵基調 */
function applyTheme(){
  document.documentElement.classList.toggle('adv', COURSE.id === 'adv');
}

function drawCoursePicker(){
  const box = $('course'); if(!box) return;
  box.innerHTML = '';
  COURSES.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'inst' + (COURSE.id === c.id ? ' on' : '');
    b.type = 'button';
    b.setAttribute('aria-pressed', COURSE.id === c.id ? 'true' : 'false');
    b.textContent = c.label;
    b.onclick = ()=>{ COURSE = c; applyTheme(); drawHome(); };
    box.appendChild(b);
  });
}

function drawHome(){
  drawCoursePicker();
  drawVolume();
  drawInstPicker('inst');

  if(COURSE.kind === 'daily'){
    show('stagewrap', false); show('dailywrap', true);
    drawDaily(); drawRadar();
    return;
  }
  show('dailywrap', false); show('stagewrap', true);

  const s = loadScore();

  const box = $('stages');
  box.innerHTML = '';

  const list = COURSE.stages;

  /* ══ 「いまの段」は一つだけ ══
     開いていて未合格、という条件だけで印を付けると、全段が開いている
     コースでは**未合格の段すべてに輪が付く。**
     未合格のうち先頭の一つに絞る。 */
  const isOpen = st => COURSE.free || st.no <= s.open;
  const isDone = st => (s.best[st.no] || 0) >= passLine(st);
  const hereNo = (list.find(st => isOpen(st) && !isDone(st)) || {}).no;

  list.forEach((st,idx)=>{
    const open = isOpen(st);
    const best = s.best[st.no] || 0;
    const done = isDone(st);
    const here = st.no === hereNo;

    const row = document.createElement('div');
    row.className = 'step' + (open ? '' : ' shut') + (done ? ' done' : '') + (here ? ' here' : '');
    if(idx === 0) row.classList.add('first');
    if(idx === list.length-1) row.classList.add('last');

    /* 段の入口と実戦の入口を分ける。ボタンの中にボタンは置けない */
    const main = document.createElement(open ? 'button' : 'div');
    main.className = 'stepmain';
    if(open) main.type = 'button';

    const node = document.createElement('span');
    node.className = 'node';
    node.textContent = done ? '✓' : (idx + 1);   /* 番号ではなく何番目か */
    main.appendChild(node);

    const txt = document.createElement('span');
    txt.className = 'steptxt';
    const b = document.createElement('b'); b.textContent = st.name;
    const i = document.createElement('i');
    i.textContent = (!open && st.no === s.open + 1)
      ? 'まえの段に合格すると開きます' : st.hint;
    txt.appendChild(b); txt.appendChild(i);
    main.appendChild(txt);

    const rt = document.createElement('span');
    rt.className = 'stepright';
    rt.textContent = open ? (best ? best + '/' + st.n : st.n + '問') : '';
    main.appendChild(rt);
    if(open) main.onclick = ()=> startStage(st);
    row.appendChild(main);

    if(open){
      const pr = document.createElement('button');
      pr.type = 'button'; pr.className = 'stepdrill';
      pr.title = '止まらない出題で10問';
      pr.textContent = '実戦';
      pr.onclick = ()=> openSpeedSheet(st);
      row.appendChild(pr);
    }
    box.appendChild(row);
  });

  drawRadar();

  const cleared = list.filter(isDone).length;
  const total = list.length;
  $('progress').textContent = cleared === 0
    ? 'まだ合格した段はありません'
    : (cleared === total ? total + '段すべてに合格しました'
                         : total + '段のうち' + cleared + '段に合格');
}

/* ══════════════════════════════════════════════════════════════
   鳴らす

   待ち時間は音の長さと切り離す。長さを見せれば答えが漏れる。
   ══════════════════════════════════════════════════════════════ */
const REARM = 700;   /* ボタンが戻るまで。全段共通の一定値 */

/* 聴くボタンの音符。端末任せの ♪ ではなく本物の輪郭を使う */
function setPlayNote(){
  const box = $('play').querySelector('.pnote');
  if(!box || box.dataset.done) return;
  const g = glyph('note', 19);
  if(g){ box.innerHTML = ''; box.appendChild(g); box.dataset.done = '1'; }
}

async function playCurrent(){
  const ac = await audioWake();
  if(!ac){ $('qnote').textContent = '音を出せませんでした。画面に一度触れてからお試しください。'; return; }
  soundStop();

  const btn = $('play');
  btn.classList.add('ringing');
  btn.disabled = true;

  SND.reset({ tone:'clean', drive:1, body:1, sustain:1, bpm:100 });

  const t0 = ac.currentTime + 0.15;
  try{ Q.seq.forEach(e=> note(t0 + e.t, e.m, 0.92, e.c, { str:e.s, v:e.v })); }
  catch(err){ console.error(err); }

  setTimeout(()=>{
    btn.disabled = false;
    btn.classList.remove('ringing');
    btn.querySelector('.plabel').textContent = 'もう一度聴く';
  }, REARM);
}

/* ══ 出題 ══ */
function nextQuestion(){
  const st = quiz.stage;
  Q = quiz.list[quiz.i];

  drawInstPicker('inst2');
  $('qstage').textContent = st.name;
  $('qcount').textContent = (quiz.i + 1) + ' / ' + st.n;
  $('qask').textContent   = Q.ask;
  $('qnote').textContent  = '';
  setPlayNote();
  $('play').querySelector('.plabel').textContent = '聴く';
  $('play').disabled = false;
  $('play').classList.remove('ringing');

  const bar = $('bar');
  bar.innerHTML = '';
  for(let k=0;k<st.n;k++){
    const d = document.createElement('span');
    d.className = 'tick' + (k < quiz.marks.length ? (quiz.marks[k] ? ' hit' : ' miss') : '')
                + (k === quiz.i ? ' now' : '');
    bar.appendChild(d);
  }

  const box = $('opts');
  box.className = 'opts ' + (Q.layout || 'plain');
  box.innerHTML = '';

  /* 音名は本物の鍵の並びで選ばせる。格子より速く正確に押せる */
  if(Q.layout === 'keys'){
    box.className = 'opts';
    box.appendChild(keyOptions(Q.options, (name, btn)=> answer(name, btn)));
    show('feedback', false);
    return;
  }

  Q.options.forEach(op=>{
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    if(Q.layout === 'shape'){
      b.appendChild(shapeGlyph(Q.shapes[op]));
      const t = document.createElement('span'); t.textContent = op; b.appendChild(t);
    }else{
      b.textContent = op;
    }
    b.onclick = ()=> answer(op, b);
    box.appendChild(b);
  });

  show('feedback', false);
}

/* ══════════════════════════════════════════════════════════════
   正解の音 — ピンポーン

   高い「ピン」から、長三度下の「ポーン」へ。玄関の呼び鈴と同じ
   下がり方である。後の一音だけを長く残すのが**ピンポーンの肝**で、
   同じ長さで二つ鳴らすと、ただの二音になる。

   ══ 音階の上に置いてはいけない ══
   これは音感を鍛える道具である。祝いの音が**十二平均律のどれかに
   当たっていると、それが基準音になってしまう。** とりわけ音名当ての段は
   毎回Cを基準に問うており、正解のたびに別の高さが刷り込まれては
   稽古にならない。

   ゆえに 1620Hz と 1285.8Hz を選んだ。**どちらも最も近い鍵の
   43セント下**——鍵と鍵のちょうど中間である。基準として使おうにも
   使えない。二つの隔たりはきっちり長三度なので、呼び鈴の響きは保たれる。

   ══ 鐘らしさは倍音で作る ══
   正弦波を一本鳴らしても電子音にしかならない。鐘は、整数倍でない
   高い響きを連れている。2.76倍の音を小さく重ねると、金属の匂いが出る。
   これは実際の鐘を測って得られている倍で、耳もそれを鐘と受け取る。

   誤りの時は鳴らさない。間違いを音で咎める必要はない。
   ══════════════════════════════════════════════════════════════ */
function bell(ac, hz, at, len, vol){
  /* 基音と、鐘らしさを出すための高い響き */
  [[1, vol], [2.76, vol * 0.22]].forEach(pair=>{
    const mul = pair[0], v = pair[1];
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = hz * mul;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(v, at + 0.006);      /* 撞いた瞬間 */
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);   /* あとは減るだけ */
    o.connect(g); g.connect(SEG || MASTER);
    o.start(at); o.stop(at + len + 0.05);
  });
}

function chime(){
  if(VOL.se <= 0) return;
  const ac = audioReady(); if(!ac || !MASTER) return;
  const t = ac.currentTime + 0.01;
  bell(ac, 1620.0, t,        0.30, 0.21);   /* ピン */
  bell(ac, 1285.8, t + 0.15, 0.85, 0.24);   /* ポーン。長く残す */
}

/* ══ 答え合わせ ══ */
function answer(chosen, btn){
  const ok = (chosen === Q.answer);
  if(ok){ quiz.ok++; chime(); }
  quiz.marks.push(ok);

  [].forEach.call($('opts').querySelectorAll('.opt'), b=>{
    b.disabled = true;
    const label = b.dataset.name ? b.dataset.name
                : (Q.layout === 'shape') ? b.lastChild.textContent : b.textContent;
    if(label === Q.answer) b.classList.add('right');
  });
  if(!ok) btn.classList.add('wrong');

  const ticks = $('bar').children;
  if(ticks[quiz.i]){ ticks[quiz.i].className = 'tick ' + (ok ? 'hit' : 'miss'); }

  $('verdict').textContent = ok ? '正解' : '不正解';
  $('verdict').className   = ok ? 'ok' : 'ng';
  $('why').textContent     = (ok ? '' : '正しくは「' + Q.answer + '」。') + Q.note;

  drawFigure(Q);

  $('next').textContent = (quiz.i + 1 >= quiz.stage.n) ? '結果を見る' : '次の問題へ';
  show('feedback', true);
  toFeedback();
}

/* ══ 答え合わせまで送る ══
   携帯の狭い画面では、答えを押しても判定と図が下に隠れたままで、
   **自分で下げないと結果が見えない。**

   出してすぐに送らない。差し込んだ物の高さが決まる前に送ると、
   中途半端な位置で止まる。一度描かせてから送る。

   送り先は判定そのものではなく、少し上。**判定・解説・図・次へ、
   の四つが一度に収まる**のが最も読みやすい。 */
function toFeedback(){
  const el = $('feedback'); if(!el) return;
  requestAnimationFrame(()=>{
    try{
      el.scrollIntoView({ behavior:'smooth', block:'center' });
    }catch(_){
      try{ el.scrollIntoView(); }catch(__){}
    }
  });
}

/* ══ 段を始める ══ */
function startStage(st){
  if(typeof clearDrill === 'function') clearDrill();
  show('drillbar', false); show('play', true); show('review', false);
  leaveHome();
  quiz = { stage:st, list:buildSet(st), i:0, ok:0, marks:[] };
  show('home', false); show('result', false); show('quiz', true);
  window.scrollTo(0,0);
  nextQuestion();
  playCurrent();
}

/* ══ 結果 ══ */
function finish(){
  soundStop();
  const st = quiz.stage, need = passLine(st), pass = quiz.ok >= need;

  /* ══ デイリーは段ではない ══
     段の解放にも最高記録にも関わらせない。
     本番のみ、能力ごとに束ねて図へ返す。 */
  if(quiz.daily){
    if(quiz.real) recordDaily(quiz.list, quiz.marks);
  }else{
    noteResult(st.no, quiz.ok);
  }

  show('quiz', false); show('result', true);
  window.scrollTo(0,0);

  $('rstage').textContent = quiz.daily
    ? (quiz.real ? 'デイリー' : 'デイリー（練習）')
    : (st.no + '. ' + st.name);
  $('judge').textContent  = pass ? '合格' : 'あと少し';
  $('judge').className    = pass ? 'ok' : '';
  $('score').textContent = st.n + '問中 ' + quiz.ok + '問 正解';

  const rb = $('rbar'); rb.innerHTML = '';
  quiz.marks.forEach((m,k)=>{
    const d = document.createElement('span');
    d.className = 'rtick ' + (m ? 'hit' : 'miss');
    d.textContent = (k+1);
    rb.appendChild(d);
  });

  if(quiz.daily){
    const d = loadDaily();
    $('rnote').textContent = quiz.real
      ? ('今日の分は記録しました。' + (d.streak > 1 ? '連続 ' + d.streak + ' 日です。' : ''))
      : 'この回は記録に残していません。';
    $('again').textContent = 'もう一度 練習する';
    $('again').onclick = ()=> startDaily(false);
    return;
  }

  const list = COURSE.stages;
  $('rnote').textContent = pass
    ? (st.no < list.length
        ? (COURSE.free ? '次は「' + list[st.no].name + '」です。'
                       : '次の段「' + list[st.no].name + '」が開きました。')
        : 'すべての段に合格しました。おつかれさまでした。')
    : '合格には ' + need + '問の正解が必要です。もう一度ためしてみましょう。';

  const go = pass && st.no < list.length;
  $('again').textContent = go ? '次の段へ進む' : 'もう一度この段をやる';
  $('again').onclick = ()=> startStage(go ? list[st.no] : st);
}

/* ══ 配線 ══ */
$('play').onclick = playCurrent;
$('next').onclick = ()=>{
  quiz.i++;
  if(quiz.i >= quiz.stage.n) finish();
  else {
    nextQuestion(); playCurrent();
    /* 下へ送ったままでは、次の問いと「聴く」が画面の外に残る */
    try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(_){ window.scrollTo(0,0); }
  }
};
$('quit').onclick = ()=>{
  if(typeof clearDrill === 'function') clearDrill();
  soundStop();
  show('drillbar', false); show('play', true);
  show('quiz', false); backHome();
};
$('back').onclick = ()=>{
  show('result', false); show('review', false);
  backHome();
};
/* ══ 記録を消す ══
   保存先はコースごと・仕組みごとに分かれている。一つずつ数え上げて
   消す。**楽器の選択と実戦の速さは記録ではなく設定**なので残す。 */
function storeKeys(){
  const ks = [];
  COURSES.forEach(c=>{ if(c.store) ks.push(c.store); });
  ks.push(DAILY_STORE);
  return ks;
}
let _wipedTimer = null;
function sayWiped(msg){
  const el = $('wiped'); if(!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(_wipedTimer);
  _wipedTimer = setTimeout(()=> el.classList.remove('on'), 3000);
}
$('wipe').onclick = ()=>{
  if(!confirm('記録をすべて消して、最初からやり直しますか')) return;
  let gone = 0;
  storeKeys().forEach(k=>{
    try{ if(localStorage.getItem(k) != null){ localStorage.removeItem(k); gone++; } }catch(_){}
  });
  COURSE = COURSES[0];
  applyTheme();
  drawHome();
  sayWiped(gone ? '記録を消しました' : '消す記録はありませんでした');
};

/* 銘板のト音記号。背景と同じ輪郭を使う */
function mountMastClef(){
  const el = $('mastclef'); if(!el) return;
  const p = document.createElementNS(NS,'path');
  p.setAttribute('d', GLYPH.clef.d);
  el.appendChild(p);
}

$('sheetscrim').onclick  = closeSpeedSheet;
$('sheetcancel').onclick = closeSpeedSheet;

(function init(){
  unlockAudioOnce();
  mountClef();
  mountMastClef();
  mountWordmark();
  applyTheme();
  drawHome();
})();

/* ══════════════════════════════════════════════════════════════
   エンジンの内側へ手を伸ばす口

   `const` と `let` は window に載らないので、外からは触れない。
   本体 tab-6.05 が `__pluckLog` を置いていたのと同じ趣旨で、
   **必要な物だけ**をここに通す。試験もここを見る。
   ══════════════════════════════════════════════════════════════ */
window.MB = {
  get AC(){ return AC; },
  get TONES(){ return TONES; },
  get FXIN(){ return FXIN; },
  get MASTER(){ return MASTER; },
  get song(){ return song; },
  get wired(){ return _fxWired; },

  /* 各段の混ぜ具合。0 ならその段は鳴っていない */
  wet(){
    const g = n => n ? n.gain.value : null;
    return { comp:g(FXCOMP_WET), wah:g(FXWAH_WET), phaser:g(FXPH_WET),
             chorus:g(FXCH_WET), flange:g(FXFL_WET), delay:g(FXDL_WET),
             room:g(FXRV_WET), trem:g(FXTR_DEPTH) };
  },

  /* ══ 尾を断つ（③）══
     戻りを 0 にすれば繰り返しは絶える。濡れの出口を閉じれば
     溜まっている返りも出てこない。**節点は壊さない**——
     `_fxId` を空にしておけば、次に鳴らす時の配り直しで開き直る。 */
  flushTails(){
    if(!AC) return;
    const t = AC.currentTime;
    const zero = n =>{ if(!n) return;
      try{ n.gain.cancelScheduledValues(t); }catch(_){}
      n.gain.value = 0; };
    if(FXDL_FB) zero(FXDL_FB);          /* ディレイの戻り */
    zero(FXDL_WET); zero(FXRV_WET);     /* 返りと残響の出口 */
    zero(FXCH_WET); zero(FXFL_WET); zero(FXPH_WET);
    _fxId = null;                        /* 次の配り直しで開き直る */
  },

  /* いま鳴っている音を止める（尾は flushTails が引き受ける） */
  stopSources(){ try{ stopAllSched(); }catch(_){} },

  SND, pluck, playClick, tone, guitarBus, fxChain, fxApply,
  audioReady, audioWake, stopAllSched, soundStop
};
