/* ══ 弾き直さずに音程を変える ══
   ハンマリング・プリング・スライドの本体。
   前の音がまだ鳴っていれば、その遅延線の再生速度だけを動かす。
   鳴っていなければ false を返し、呼び出し側でふつうに弾き直す。 */
/* その弦の鳴っている音だけを静かに引く。
   dampVoices は全弦を止めるので、抜けには使えない */
/* その弦以外の余韻をすぼめる（tab-2.72）。
   `hold` の立った声（let ring・伸ばしている最中のタイ）には手を触れない */
function hushOthers(str,at,ms){
  LASTV.forEach((v,k)=>{
    if(k===str) return;
    if(v&&v.hold) return;
    hushVoice(k,at,ms||45);
  });
}
function hushVoice(str,at,ms){
  const v=LASTV.get(str);
  if(!v||!v.g||v.offAt<=at) return false;
  const f=(ms||60)/1000;
  try{
    const g=v.g.gain, lv=Math.max(0.0001,voiceLevelAt(v,at));
    g.cancelScheduledValues(at);
    g.setValueAtTime(lv,at);
    g.exponentialRampToValueAtTime(0.0001,at+f);
  }catch(e){ return false; }
  v.offAt=Math.min(v.offAt,at+f);
  return true;
}

/* ══════════════════════════════════════════
   抜けてゆく（グリスアウト）

   ══ 音量を戻すだけでは足りない ══
   はじめ、鳴っている音の高さを動かし、痩せた分をゲインで押し戻していた。
   数値の上では弾いた瞬間の大きさに戻る。それでも**痩せて聞こえる**。

   Karplus-Strong は**高域の減衰も波形に焼き込まれている**からである。
   音価の半ばでは倍音が既に失われており、音量を戻しても倍音は戻らない。
   ゲインで戻せるのは大きさだけで、中身は戻らない。

   ══ ゆえに弾き直す ══
   実物も、指が弦を擦って滑る時には新たに音が立っている。
   摩擦そのものが弦を励起するからで、これは誤魔化しではなく、そういう物である。
   新しい声は倍音を持って生まれるので、痩せない。
   ただしピックの当たりは出さない（右手は弾いていない）。
   ══════════════════════════════════════════ */
function slideOut(s,t,str,midi,t0,dur,vol){
  if(!t||!t.slOut||typeof midi!=='number') return false;
  /* 抜け出す所は譜面が持つ（tab-4.84。既定は丈の 55%） */
  const _f=(typeof t.slOutAt==='number')?Math.max(0.05,Math.min(0.95,t.slOutAt)):0.55;
  const wait=Math.max(0.05,dur*_f);
  const d=Math.min(0.30,Math.max(0.13,dur*0.45));
  const at=t0+wait;
  const XF=0.022;                       /* 入れ替わりに掛ける時間 */

  /* ══ 元の声が「いま居る場所」を引き継ぐ ══
     同じバッファの同じ地点から鳴らせば、波形の状態も音量も倍音も一致する。
     頭から鳴らすから発音に聞こえるのであって、途中から拾えば発音は起きない。
     残るのは位相の食い違いだけで、それは短い入れ替わりで均せる。 */
  const v=LASTV.get(str);
  const el=(v&&v.at!=null)?Math.max(0,at-v.at):0;
  const lv=v?Math.max(0.0001,voiceLevelAt(v,at)):vol;
  /* ══ 抜けは「いま鳴っている高さ」から始める（tab-1.65）══
     以前は**譜面に書かれた高さ**から始めていた。だがこの弦は、
     チョーキングで上がっていたり、プリベンドで最初から上がっていたりする。
     そこへ書かれた高さの声を立てると、受け渡しの瞬間に**音程が飛ぶ**——
     耳には「もう一つ別の音が出た」と聞こえる。
     実測（1音チョーキング＋グリスアウト）で **2半音跳ねていた。**
     `holdTab` は `n.midi+semi` と自分で足していたが、`strumTab` は足していない。
     **足す場所を呼ぶ側に置いたのが誤り。**ここで声に聞けば一箇所で済む。 */
  const from=(v&&typeof v.midi==='number')?v.midi:midi;

  /* 古い声を落としながら、新しい声を同じだけ持ち上げる。
     どちらかが先に立つと、そこが継ぎ目として聞こえる */
  hushVoice(str,at,XF*1000);
  pluck(at,from,lv,d*0.78,
        {str:str,soft:true,skip:el,fadeIn:XF,
         glide:{semi:(t.slOut==='up'?7:-7),dur:d}});
  /* 擦れる音は入れない。弦は鳴り続けており、ここで新たに立つ音は無い */
  return true;
}

/* ══ 抜けてゆく（グリスアウト）══
   鳴っている音を、そのまま滑らせて消す。弾き直さない。

   `glideVoice` は使えない。あれは繋ぐための仕掛けで、
   焼き込まれた減衰を**押し戻して音量を揃える**。
   抜けは逆に、滑りながら痩せてゆく音である。押し戻しては別物になる。 */
function glideOut(str,at,semi,dur){
  const v=LASTV.get(str);
  if(!v||!v.pr||v.offAt<=at+0.01) return false;
  const to=v.base*Math.pow(2,semi/12);
  try{
    v.pr.cancelScheduledValues(at);
    v.pr.setValueAtTime(v.base,at);
    v.pr.linearRampToValueAtTime(to,at+dur);
  }catch(e){ return false; }
  /* ══ 焼き込まれた減衰を押し戻してから消す ══
     Karplus-Strong のバッファは、減衰が波形そのものに焼き込まれている。
     抜けが始まる音価の半ばでは、音量は既に三分の一以下まで落ちている。
     そこから更に消してゆけば、**予約は入っているのに耳には届かない**。
     実物は指がまだ弦を押さえて滑らせているのだから、ここで鳴っていなければ嘘になる。

     バッファは decT 秒で 0.001 まで落ちるので、経過 τ に対して
     1000^(τ/decT) を掛ければ弾いた瞬間の大きさへ戻る。
     繋ぎ（glideVoice）と違って弾き直しではないので、上乗せはしない。 */
  try{
    const g=v.g.gain;
    const el=Math.max(0,at-v.at);
    const comp=Math.min(10,Math.pow(1000,el/Math.max(0.2,v.decT||1)));
    const lv=Math.min(2.2,Math.max(0.0001,voiceLevelAt(v,at))*comp);
    g.cancelScheduledValues(at);
    g.setValueAtTime(lv,at);
    /* 滑り切るまでは張って、そこから落とす。
       滑りながら痩せきると、どこへ抜けたのか分からなくなる */
    g.setValueAtTime(lv*0.85,at+dur*0.6);
    g.exponentialRampToValueAtTime(0.0001,at+dur*1.35);
  }catch(e){}
  /* 滑って消えた音を、次の繋ぎの出発点にしない */
  v.offAt=Math.min(v.offAt,at+dur*1.35);
  LASTV.delete(str);
  return true;
}

/* ══ 弾き直さずに、鳴っている弦を上げる（tab-1.49）══
   `glideVoice` は「次の音へ移る」ためのもので、音量を弾いた時まで押し戻し、
   指が弦を打つ当たりまで出す。**チョーキングにはどちらも要らない。**
   実弦では、上げても新しく音が生まれるわけではなく、痩せてゆく途中の音が
   そのまま上がる。ここは音程だけを動かす。

   鳴っていなければ何もしない（前の音が既に消えているなら、上げる弦が無い）。 */
/* ══ その弦が、いまどれだけ上がっているか（tab-3.90）══
   `v.midi` は上げ切った先を控えている（`bendVoice` が更新する）。
   素の高さ（`v.midi0`）との差が、いま張られている分。 */
function bentSemisOf(str,at){
  const v=LASTV.get(str);
  if(!v||v.midi==null||v.midi0==null) return 0;
  if(v.offAt<=at+0.005) return 0;          /* もう鳴っていない */
  return Math.max(0,v.midi-v.midi0);
}
/* ══ 揺れは「なめらかに」「押した側へ」（tab-4.31）══
   L様——「ビブラートのワイドがめっちゃ音痴に聞こえる」。

   仰るとおりであった。二つ、間違っていた。

   ① **矩形波だった。** `setValueAtTime` で ±深さへ**跳ばして**半周期
      留めていたので、揺れではなく**二つの音の往復**になっていた。
      浅いうちは目立たないが、広くすると「別の音痴な音が混ざる」。
   ② **上下対称だった。** 弦を押して揺らす技であるから、実際の音程は
      **書かれた高さから上へ**動いて戻る。上下に振ると、鳴っている時間の
      半分が**書かれた音より低い**——これが音痴の正体である。

   > **弦は押されて上がる。下がりはしない。**

   なめらかな三角波にし、片側（上）へ振る。始めの一往復は浅くして、
   **弾いた瞬間から全開で揺れない**ようにする（実際の手もそう動く）。
   `to` は中心の高さ（比）、`dep` は片側の振れ幅（半音）。 */
/* ══ 揼んで、戻して、休む（tab-4.54）══
   L様——「ビブラートがもとの音程に戻ってないように聞こえる」
   「ギター的にしてほしい。普通正しい音から上に上げてもとの音程に戻るだけ」。

   揺れそのものは、終われば必ず書いた高さへ戻っていた。
   戻っていなかったのは**鳴っている最中の平均**である。

   tab-4.31 の三角波は、上げるのと戻すのに**半々の時間**を使っていた。
   ゆえに平均の高さが**幅の半分**だけ上がる——1音なら +100セント。
   耳は揺れる音の高さを平均で聞き取るので、まるまる半音高い音に聞こえる。
   しかも折り返し（頂点）で動きが最も遅くなるので、
   **頂点の音もひとつの音として居座ってしまう。**

   直しの筋は、下げることではない——**手の動きそのものを写す**ことである。
   弦を押す手は、すばやく押し上げて、すばやく戻し、
   **元の位置でひと息休む。** 頂点には留まらない。

   > **下げない。代わりに、帰ってきて休む。**

   一往復を三つに分ける——**押し上げ／戻し／休み。**
   休みの長さは幅に応じて伸びる（広く押すほど、手は戻って一息入れる）。
   これで**書いた高さが毎周、耳に戻ってくる**。平均の上がりは——
     クォーター +25セント → +13セント
     半音       +50セント → +23セント
     1音       +100セント → +39セント
   底は書いた高さそのものであり、**一度も下へは出ない**。

   さらに、幅と周期にほんの少しゆらぎを与える。
   寸分違わぬ往復は機械の揺れであって、人の手の揺れではない。
   終わりの一往復は幅を細めて着地させる（手もそのように止まる）。
   余った時間は素の高さで休むので、音符の終わりは必ず書いた高さである。 */
const VIB_PUSH=[[0.45,0.16],[0.78,0.60],[1.00,1.00]];   /* 押し上げ　（区間の割合, 幅の割合） */
const VIB_REL =[[0.28,0.58],[0.60,0.20],[1.00,0.00]];   /* 戻し　　　頂点には留まらない */
function applyVib(pr,to,vt0,dep,rate,room){
  const per0=1/Math.max(1.5,rate||5.5);          /* 一往復の秒数 */
  const d=Math.max(0,dep||0);
  const rest=Math.min(0.46,0.24+0.11*d);         /* 広いほど、元の位置で長く休む */
  const pushF=(1-rest)*0.55, relF=(1-rest)*0.45; /* 戻しは押しよりもやや早い */
  const up=a=>to*Math.pow(2,(d*a)/12);
  const nC=Math.max(1,Math.min(64,(room!=null&&room>0)?Math.floor(room/per0):12));
  pr.setValueAtTime(to,vt0);
  let t=vt0+per0*0.18;                           /* 弾いた高さをひと息聞かせてから */
  pr.setValueAtTime(to,t);
  for(let c=0;c<nC;c++){
    const per=per0*(0.94+Math.random()*0.12);
    const grow=(c===0)?0.38:((c===1)?0.72:1);    /* 弾いた瞬間から全開では揺れない */
    const fade=(nC>=3&&c===nC-1)?0.55:1;         /* 終わりは細めて着地 */
    const a=Math.max(0,Math.min(1,grow*fade*(0.93+Math.random()*0.14)));
    VIB_PUSH.forEach(([f,lv])=>pr.linearRampToValueAtTime(up(a*lv),t+per*pushF*f));
    VIB_REL .forEach(([f,lv])=>pr.linearRampToValueAtTime(up(a*lv),t+per*(pushF+relF*f)));
    t+=per;
    pr.setValueAtTime(to,t);                     /* 休み。次の押し上げはここから始まる */
  }
  return t;
}
function bendVoice(str,at,semi,dur,vib){
  const v=LASTV.get(str);
  if(!v||!v.pr||v.offAt<=at+0.005||v.at>at+0.001) return false;
  const to=v.base*Math.pow(2,semi/12);
  try{
    v.pr.cancelScheduledValues(at);
    v.pr.setValueAtTime(v.base,at);
    const rise=semi?Math.max(0.03,dur):0;
    if(semi) v.pr.linearRampToValueAtTime(to,at+rise);
    if(vib){
      /* 上げ切った先で揺らす。丈に収め、終わりは中心へ戻す（tab-1.47 と同じ筋） */
      const vt0=at+rise+0.02;
      applyVib(v.pr,to,vt0,vib.depth||0.25,vib.rate||5.5,
               (vib.dur>0)?(at+vib.dur-vt0):null);
    }
  }catch(e){ return false; }
  /* 落ち着いた高さを控え直す。次の音を繋ぐ時（チョークダウン等）の出発点になる */
  v.midi=v.midi+semi; v.base=to;
  return true;
}

/* ══ 押し戻せる大きさの上限（tab-1.60）══
   Karplus-Strong のバッファは減衰が波形に焼き込まれているので、
   繋ぐ時は経過ぶんを掛けて押し戻す。だが**上限がある**——
   持ち上げすぎると雑音まで浮くため、14倍で頭を打たせている。
   この一つの数を、**押し戻す所と、諦める所の両方で使う。**
   別々に持つと、いつか食い違う（寸法を決める場所は一つ）。 */
const LEG_COMP_MAX=14;
/* ══ 押し戻せる大きさの、もう一つの頭（tab-1.63）══
   押し戻した先の音量にも頭がある（3.0）。**関門はこちらが先に効く。**
   弾いた時の音量 0.3・繋ぎの上乗せ 1.5 なら、6.7倍で頭を打つ——
   つまり `LEG_COMP_MAX`（14倍）は**そもそも届かない**。
   二つの頭を別々に持ち、諦める判断が片方しか見ていなかったのが tab-1.60 の穴である。 */
const LEG_GAIN_CEIL=3.0;
/* どれだけ足りなくても繋ぐか。1.5＝約3.5dB の不足まで許す */
const LEG_SHORT_OK=1.5;

/* ══ 曲げ始めるのは、いつか（tab-2.13）══
   L様のお申し出——「8小節目がスライドした後にベンドに聞こえない」。
   実測すると、**スライドとチョーキングが地続き**になっていた。

     ⑧（スライド→1音チョーキング） 64 →64.6 65.8 67.0→ 67.7 68.4 69.0
     （比較）ハンマリング→同じ    64 →67.0 67.0 67.0→ 67.7 68.4 69.0

   ハンマリングは音程が一瞬で移るので、着いた先が **0.2秒ほど平らに聞こえてから**
   曲がり始める。だからスライドとの違いが耳に立つ。
   ところがスライドは滑るのに 0.2秒かかり、**滑り終わった 5ミリ秒後**に
   曲げ始めていた。切れ目が無いので、耳には**長いスライド一本**にしか聞こえない。

   直しの筋——**曲げ始めるのは、着いた先がいちど聞こえてから。**
   滑る時間（`land`）と、着いた先を聞かせる時間（`hold`）を分けて足す。
   ハンマリングは滑る時間が 0 なので、これまでと同じ間合いになる。

   ただし**音符の丈に収める。** 入り切らないなら削るのは `hold` の方である
   ——間が短いのと、チョーキングが鳴らないのとでは、後者の方が罪が重い
   （`bendVoice` は音符が終わっていれば黙って何もしない）。

   ══ 装飾音符が先に鳴っていれば、間は要らない（tab-2.15）══
   L様のお申し出——「装飾のベンドがゆっくり過ぎて違和感」。実測——

     素のチョーキング     弾く→曲げ始め   8ms   弾く→上げ切り 216ms
     装飾つき（tab-2.14） 弾く→曲げ始め 283ms   弾く→上げ切り 491ms

   **倍以上かかっていた。** tab-2.10 以降、チョーキングには既定で装飾音符が添うので、
   **この道具のチョーキングは、ほぼ全部この遅い方を通っていた。**

   筋を取り違えていた。`hold` は「着いた先をいちど聞かせる」ための間である。
   ところが**装飾音符は、まさにそれを担う記号**——弾いた音がそのまま
   出発点として鳴っている。上から間を足せば、二重に待つことになる。
   そこで上限（`holdMax`）を渡せるようにし、装飾音符の枝からは
   **既に聞こえたぶんを差し引いた残り**だけを渡す。 */
function bendStartAfter(t0,dur,rise,land,holdMax){
  const cap=(holdMax==null)?0.20:Math.max(0,holdMax);
  const hold=Math.min(cap,Math.max(0.01,dur*0.20));
  const room=t0+dur*0.92-rise;                 /* ここまでに始めれば鳴り切る */
  return Math.max(t0+land+0.005,Math.min(t0+land+hold,room));
}
/* 出発点が耳に残るのに要る時間。装飾音符が鳴っていた分は、ここから差し引く */
const BEND_EAR=0.09;

function glideVoice(str,at,midi,opt){
  const v=LASTV.get(str);
  if(!v||!v.pr||v.offAt<=at+0.005||v.at>at+0.001) return false;
  /* 折り返しの断ちを挟む場合は繋がない（周をまたいで滑ってしまう） */
  if(TP&&TP.damps&&TP.damps.some(dt=>dt>v.at&&dt<=at+0.001)) return false;
  /* ══ 押し戻して届くか（tab-1.60 → tab-1.63 で作り直し）══
     関門はもともと `offAt`——**バッファが尽きるまで**——だけであった。
     バッファは decT 秒で 0.001 まで落ちるので、その手前でも
     とうに聞こえなくなっている。**予約は入るのに耳には届かない。**
     `glideVoice` が真を返すので、呼び出し側は弾き直しに回らず、
     **繋げたつもりで、何も起きていない**という一番厄介な形になる。

     ── tab-1.60 では足りなかった ──
     あの時は `LEG_COMP_MAX`（押し戻す倍率の頭）だけを見て諦める所を決めた。
     だが**先に効く頭は音量の側（3.0）**である。しかも押し戻しは
     `Math.max(lv,target)`——**下げない**——と書いてあるので、
     繋ぎを続けて既に頭を打っていると、次の繋ぎは**何も上げない。**

     波形を組み立てて測って分かったこと（第6小節・3弦）——
       17.7秒 ハンマリング … 前が 1.10 だったので 3.0 まで上がる（+8dB）
       18.4秒 プリング   … 既に 3.0。**上げ幅ゼロ。** 弦は落ち続けるだけ
     **繋ぎを重ねた二つ目以降が、黙って何も起こさなくなる。**

     ゆえに「要る大きさ」と「出せる大きさ」を**両方の頭から**出して比べる。
     届かないなら false を返し、呼び出し側に柔らかく弾かせる。
     実弦でも、鳴っている弦を叩けば**そこで新しい音が立つ**——
     指が弦を打つこと自体が弦を励起するからで、グリスアウトで
     「摩擦そのものが弦を励起する」として弾き直したのと同じ理屈である。 */
  {
    const _el=Math.max(0,at-v.at), _v0=(v.vol0||v.vol);
    const _lift=(opt&&opt.slide)?1.25:1.5;
    const _need=_v0*Math.pow(1000,_el/Math.max(0.2,v.decT))*_lift;   /* 元の大きさへ戻すのに要る */
    const _can=Math.min(LEG_GAIN_CEIL,_v0*LEG_COMP_MAX*_lift);       /* 二つの頭のうち低い方 */
    /* ══ 戻しは、弦を励起しない技である（tab-6.05）══
       L様——「そもそもループとか関係なく音がダウンになってない」。

       DARK 11小節目（♩=71・全音チョーキングを付点四分ぶん伸ばして戻す）を
       鳴らして音程の予約を数えたところ——
         経過 1.30秒／素の大きさ 0.255／減衰の時定数 3.22秒
         → 押し戻すのに要る 5.19、出せるのは 3.00（`LEG_GAIN_CEIL`）
       ゆえにこの関門が閉じ、戻しは**弾き直しへ落ちていた。**
       耳には「素の 15F が弾き直され、下がらない」と聞こえる。
       1小節目が鳴っていたのは伸ばしが 1.33拍と**わずかに短い**からで、
       同じ書き方でも音価一つで裏返る——ゆえに「明らかに違う」。

       ここで諦めるのは、繋ぎが**弦を弾き直せば取り返せる**技（h・p・s）
       だからである。指が弦を打てば、そこで新しい音が立つ。
       だが**戻し（`bd`）は違う。** 張った弦をゆるめるだけで、
       右手はどこにも触れない——**弾き直しは、譜面に無い音を足すことである。**
       痩せていようと、鳴っている弦の高さを下ろすほかない。

       > **取り返せる技だけが、諦めてよい。** */
    if(_can<_need/LEG_SHORT_OK&&!(opt&&opt.keep)) return false;
  }
  const to=v.base*Math.pow(2,(midi-v.midi)/12);
  try{
    v.pr.cancelScheduledValues(at);
    v.pr.setValueAtTime(v.base,at);
    /* ハンマリング・プリングは即座に、スライドは少し掛けて移る */
    /* 下限は 0.02（tab-2.65 で 0.05→0.03、tab-2.66 でさらに下げた）。
       〈ごく短い〉装飾音符が 0.028 を頼むので、上で止めると設定が効かない。
       頼まれない限り届かない値なので、ふつうのスライドの手触りは変わらない */
    /* 叩いてあるなら滑らせない（tab-4.49）。呼ぶ側が丈を短く渡してくる */
    const d=(opt&&opt.slide)?Math.max(0.015,Math.min(0.20,opt.dur||0.12)):0.018;
    v.pr.linearRampToValueAtTime(to,at+d);
    if(opt&&opt.vib){
      /* 繋いだ先の揺れも、丈に収めて中心で締める（tab-1.47。上の pluck と同じ筋） */
      const vt0=at+d+0.05+Math.max(0,opt.vib.wait||0);   /* 付けた所から（tab-4.95） */
      applyVib(v.pr,to,vt0,opt.vib.depth||0.25,opt.vib.rate||5.5,
               (opt.vib.dur>0)?(at+opt.vib.dur-vt0):null);
    }
  }catch(e){ return false; }
  /* ══ 音量を落とさない ══
     Karplus-Strong のバッファは、減衰が波形そのものに焼き込まれている。
     ゲインを元に戻すだけでは、既に痩せた波形を素の音量で鳴らすことになり、
     ハンマリングの先が尻すぼみに聞こえる。
     **減った分をこちらで計算して押し戻す。**
     バッファは decT 秒で 0.001 まで落ちるので、経過 τ に対して
     1000^(τ/decT) を掛ければ、弾いた瞬間と同じ音量に戻る。
     持ち上げすぎると雑音まで浮くので、上限を設ける。 */
  const el=Math.max(0,at-v.at);
  /* ══ 焼き込まれた減衰を押し戻す ══
     バッファは decT 秒で 0.001 まで落ちるので、1000^(τ/decT) を掛ければ
     弾いた瞬間と同じ大きさに戻る。上限は雑音が浮かない範囲で広めに取る。
     さらに LEG_LIFT ぶん足す。**音そのものの大きさが揃っても、
     鳴り続けている音は頭の当たりが無いぶん小さく聞こえる**ため。 */
  /* ══ プリングは弦を弾いている（tab-1.64）══
     ハンマリングは弦を「打つ」だけだが、プリングは指で弦を**引っ掛けて放す**。
     実弦では、こちらの方が明らかに音が立つ。以前は同じ扱いだったので、
     長く伸ばした先のプリングが、音程だけ動いて articulation が立たなかった。 */
  const LEG_LIFT=(opt&&opt.slide)?1.25:((opt&&opt.pull)?1.85:1.5);
  const comp=Math.min(LEG_COMP_MAX,Math.pow(1000,el/v.decT));
  const target=Math.min(LEG_GAIN_CEIL,(v.vol0||v.vol)*comp*LEG_LIFT);
  try{
    const lv=voiceLevelAt(v,at);
    v.g.gain.cancelScheduledValues(at);
    v.g.gain.setValueAtTime(Math.max(0.0001,lv),at);
    /* 立ち上がりは短く。長いと「膨らむ」音になって不自然 */
    v.g.gain.linearRampToValueAtTime(Math.max(lv,target),at+0.008);
  }catch(e){}
  /* ══ 明るさを戻す ══
     時間が経った弦は倍音が落ちている。音量だけ上げると、こもった音が
     大きくなるだけで「近づいて」こない。頭だけ開けて、すぐ戻す。 */
  try{
    if(v.bq&&v.c0&&v.bq.frequency.setValueAtTime){
      v.bq.frequency.cancelScheduledValues(at);
      v.bq.frequency.setValueAtTime(Math.min(15000,v.c0*2.2),at);
      if(v.bq.frequency.exponentialRampToValueAtTime)
        v.bq.frequency.exponentialRampToValueAtTime(v.c0,at+0.16);
    }
  }catch(e){}
  /* 指が弦を打つ／引っ掛ける当たり。スライドには当たりが無いので出さない */
  if(!(opt&&(opt.slide||opt.noHit))) fingerHit(at,Math.min(0.16,(v.vol0||0.2)*0.5),(opt&&opt.pull));
  v.midi=midi; v.base=to;
  /* ══ 滑って移った先が、新しい素の高さ（tab-3.90）══
     スライドやハンマリングで音程が移ったなら、そこが押さえた高さ。
     **チョーキングで上げた分とは別物**なので、素の高さも書き換える。

     ══ ただし、張ったまま移ったなら張りは残る（tab-4.36）══
     着地の高さで丸ごと書き換えていたので、**繋いだ先で張りが忘れられて**
     いた。`12F(1音) ─h→ 17F(T) ─s→ 19F` の三つめが、
     素の 19F へ落ちて鳴っていた——左手はまだ張ったままなのに、である。
     > **書き換えるのは押さえた高さだけ。張りは張りとして持ち越す。**
     呼ぶ側が渡した張り（`opt.held`）を差し引いて素の高さを出す。 */
  v.midi0=midi-Math.max(0,(opt&&opt.held)||0);
  v.relAt=null; v.rel=0.06;            /* 戻した音量を、いまの音量として扱い直す */
  v.vol=target;
  return true;
}

/* ブラシ／ミュート：ピッチのない擦過音 */
/* ══ 擦過音（tab-2.42 で中身を選べるようにした）══
   `o.freq` … 帯域の中心。低いほど「弦を撫でた」太い音になる
   `o.q`    … 締まり。`o.dur` … 丈
   既定は左手のミュート（×）や空振りの当たり——短く、軽く、高い。 */
function scrape(at,vol,up,o){
  if(!AC) return;
  o=o||{};
  const D=Math.max(0.04,o.dur||0.13);
  const sr=AC.sampleRate, len=Math.round(sr*D);
  const buf=AC.createBuffer(1,len,sr), b=buf.getChannelData(0);
  /* ══ 中身の丈（tab-2.45）══
     既定は当たりの音なので、頭から落ちてゆく（e²）。
     `o.hold` を渡すと、その割合まで**大きさを保ってから**落ちる。
     拾いは「撫でて渡っている間ずっと鳴る」音なので、頭で落ちては届かない。 */
  const hold=Math.max(0,Math.min(0.9,o.hold||0));
  for(let i=0;i<len;i++){
    const u=i/len;
    const e=(u<hold)?1:(1-(u-hold)/(1-hold));
    b[i]=(Math.random()*2-1)*e*e;
  }
  const src=AC.createBufferSource(); src.buffer=buf;
  /* ══ 帯を絞りすぎない（tab-2.45）══
     狭い帯域通過は**通る成分そのものを削る。** 音量の数値を上げても届かない
     ——「全然小さい」の正体がこれであった。
     拾いのように**音量が要る音**は、低い側と高い側を切るだけに留める。 */
  const g=AC.createGain();
  let head, tail;
  if(o.wide){
    const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=o.hp||180;
    const lp=AC.createBiquadFilter(); lp.type='lowpass';  lp.frequency.value=o.lp||2800;
    hp.connect(lp); head=hp; tail=lp;
  } else {
    const bq=AC.createBiquadFilter(); bq.type='bandpass';
    bq.frequency.value=o.freq||(up?2600:1700); bq.Q.value=o.q||0.9;
    head=bq; tail=bq;
  }
  g.gain.setValueAtTime(vol,at);
  g.gain.exponentialRampToValueAtTime(0.0001,at+D);
  src.connect(head); tail.connect(g); g.connect(guitarBus()||MASTER);  /* 擦過音も胴を通す */
  src.start(at); src.stop(at+D+0.03);
}

/* ══ ピックスクラッチの音（tab-2.26）══
   `scrape` は一瞬の擦れ（ミュートやレイキングの当たり）である。
   ピックスクラッチは**音価いっぱい擦り続ける**技なので、別に持つ。

   要るものは三つ。
     ① 溝を渡る当たり … 一様な雑音では「砂」にしか聞こえない。
        巻き弦の溝の間隔ぶんで山谷を刻む。
     ② 音程の移り … 下降はネックへ向かうので明るさが落ち、上昇はその逆。
        帯域の中心を掃かせて示す。**ここが向きの正体**である。
     ③ 尻すぼみにしない … 擦っている間じゅう鳴るので、
        終わり際まで大きさを保ち、最後だけ落とす。 */
function pickScratch(at,dur,up,accent){
  if(!AC) return;
  const D=Math.min(2.4,Math.max(0.09,dur));
  const sr=AC.sampleRate, len=Math.max(128,Math.round(sr*D));
  const buf=AC.createBuffer(1,len,sr), o=buf.getChannelData(0);

  /* ══ 溝を渡る当たりが「高さ」を作る（tab-2.38）══
     はじめは一定の間隔で雑音を刻んでいた。**間隔が変わらなければ高さも変わらない**——
     ゆえに「ジーッ」ではなく、ただの砂音に聞こえていた。
     ピックスクラッチの正体は**当たりの連なりそのもの**であって、
     帯域を掃いた雑音ではない。当たりの間隔を滑らせれば、高さが滑る。 */
  const f0=up?240:1200, f1=up?1200:240;      /* 当たりの毎秒回数 */
  const dec=Math.exp(-1/(sr*0.0007));        /* 一つの当たりの余韻（0.7ms） */
  let ph=0, imp=0;
  for(let i=0;i<len;i++){
    const u=i/len;
    ph+=(f0*Math.pow(f1/f0,u))/sr;
    if(ph>=1){ ph-=1; imp=0.8+Math.random()*0.4; }   /* 溝を一つ越えた */
    /* 当たりの列＋擦れの地の音。地だけでは砂、当たりだけでは電子音になる */
    o[i]=imp*0.72+(Math.random()*2-1)*0.20;
    imp*=dec;
  }

  const src=AC.createBufferSource(); src.buffer=buf;
  /* 巻き線の金属らしさ。掃くのは当たりの高さに従わせる */
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.5;
  bp.frequency.setValueAtTime(up?900:2800,at);
  bp.frequency.exponentialRampToValueAtTime(up?2800:900,at+D);
  const pk=AC.createBiquadFilter(); pk.type='peaking';
  pk.frequency.value=1800; pk.Q.value=1.1; pk.gain.value=6;
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=260;

  const g=AC.createGain();
  const vol=accent?0.34:0.26;
  const ar=Math.min(0.018,D*0.2);
  g.gain.setValueAtTime(0.0002,at);
  g.gain.exponentialRampToValueAtTime(vol,at+ar);
  g.gain.setValueAtTime(vol,at+Math.max(ar,D*0.80));
  g.gain.exponentialRampToValueAtTime(0.0001,at+D);

  src.connect(bp); bp.connect(pk); pk.connect(hp); hp.connect(g);
  g.connect(guitarBus()||MASTER);
  src.start(at); src.stop(at+D+0.03);
}

/* ══════════════════════════════════════════════════════════════
   音の差し替え口と、鳴らし・止めの作法

   ここが出題側とエンジンの唯一の境である。出題側は SND しか
   触らない。エンジンの内側には手を入れない。
   ══════════════════════════════════════════════════════════════ */
const SND = {

  /* ══ 摘みは足すもの、消すのは明示（②）══
     以前は fx を渡すたび丸ごと置き換えていた。
     ディレイを立ててからコーラスを立てると、ディレイが消える。
     UI は重ね掛けできる作りなのに、これでは食い違う。
     **足すのが常、消すのは断って消す。** */
  set(o){
    o = o || {};
    const p = song.play;
    if(o.tone    != null) p.tone    = o.tone;
    if(o.drive   != null) p.drive   = o.drive;
    if(o.body    != null) p.body    = o.body;
    if(o.sustain != null) p.sustain = o.sustain;
    if(o.bpm     != null) p.bpm     = o.bpm;
    if(o.fx)      p.fx = Object.assign({}, p.fx || {}, o.fx);
    if(typeof fxApply === 'function') fxApply();
  },

  /* 摘みを全て降ろす。ここだけが全消しの道 */
  clearFx(){
    song.play.fx = {};
    if(typeof fxApply === 'function') fxApply();
  },

  /* 音色と摘みを一度に決め直す（出題の頭で使う） */
  reset(o){ this.clearFx(); this.set(o); }
};

/* ══ 器を起こす（⑤）══
   `resume()` は約束（Promise）を返す。返る前に予約を出すと、
   iOS では**最初の音が出ない。** 起き切るまで待ってから鳴らす。

   眠りの名は一つではない——`suspended` は browser の節電、
   `interrupted` は iOS が別の音に譲った時。どちらも起こす。 */
let _wakeWait = null;
function audioWake(){
  const ac = audioReady();
  if(!ac) return Promise.resolve(null);
  if(ac.state === 'running') return Promise.resolve(ac);
  if(ac.state === 'closed')  return Promise.resolve(null);
  if(_wakeWait) return _wakeWait;
  _wakeWait = Promise.resolve()
    .then(()=> ac.resume())
    .catch(()=>{})
    .then(()=> new Promise(r=>{
      /* resume が済んでも state の切り替わりが一拍遅れる器がある。
         走り出すまで短く見張る（最長 1 秒）。 */
      const t0 = Date.now();
      const look = ()=>{
        if(ac.state === 'running' || Date.now() - t0 > 1000) return r(ac);
        setTimeout(look, 30);
      };
      look();
    }))
    .then(a=>{ _wakeWait = null; return a; });
  return _wakeWait;
}

/* ══ 止める（③）══
   `stopAllSched` が断つのは**音源**である。ディレイの戻りと
   残響の畳み込みは節点の中に溜まっており、音源を止めても残る。
   前の問いの尾が次の問いに混じれば、聴き比べは成り立たない。

   ゆえに二段で止める：
     ① 音源を断つ（これまで通り）
     ② 尾を断つ——戻りを 0 にし、濡れの出口を閉じる

   **列は壊さない。** 節点を捨てれば揺れ（LFO）も死に、組み直しの
   たびに音が変わる。閉じるだけに留め、次の配り直しで開き直す。 */
function soundStop(){
  try{ stopAllSched(); }catch(_){}
  try{ MB.flushTails(); }catch(_){}
}

/* ══════════════════════════════════════════════════════════════
   ピアノの音（加算合成）

   ギターの音は撥弦のモデル（Karplus-Strong）で作られている。
   ピアノは打弦で、倍音の並びも減衰の仕方も違うため、同じ道具では
   出せない。倍音を一本ずつ重ねて作る。

   ピアノらしさを決めているのは、主に次の三つ：

     ① 倍音がわずかに上ずる（インハーモニシティ）
        弦に硬さがあるため、第n倍音は基音のちょうどn倍にならず
        少しだけ高い。これがピアノの独特の輝きを生む。
        f(n) = n・f0・√(1 + B・n²)

     ② 高い倍音ほど早く消える
        弾いた瞬間は明るく、伸びるにつれ丸くなる。

     ③ 減衰が二段になっている
        最初に速く落ち、そのあと長く尾を引く。

   ══ 音の高さは正確に保つ ══
   本物のピアノは1音を2〜3本の弦で鳴らし、その弦をわずかにずらして
   ある。ゆえに実物には常にゆるやかなうなりがある。
   だがこの道具はセント単位のズレを聴き分ける稽古に使う。
   **弦のずらしを入れれば、そのうなりが判定を濁す。**
   ここでは入れない。高さは一つに揃える。
   ══════════════════════════════════════════════════════════════ */

/* 低い音ほど長く伸びる */
function pianoDecay(midi){
  return Math.max(0.9, Math.min(13, 8.0 * Math.pow(2, -(midi-48)/24)));
}

/* 弦の硬さ。高い音ほど弦が短く、上ずりが強く出る */
function pianoB(midi){
  /* 強すぎると倍音が大きく上ずり、ピアノではなく鐘になる。
     実物の中音域はおよそ 0.0002〜0.0004。 */
  return 0.00022 * Math.pow(2, (midi-60)/22);
}

/* 打鍵の音（ハンマーが弦を叩く一瞬の雑音） */
function pianoHammer(at, vol, midi, out){
  if(!AC) return;
  const len = Math.max(2, Math.round(AC.sampleRate * 0.014));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const o   = buf.getChannelData(0);
  for(let i=0;i<len;i++){ const e = 1 - i/len; o[i] = (Math.random()*2-1) * e * e * e; }

  const src = AC.createBufferSource(); src.buffer = buf;
  const bp  = AC.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = Math.min(3800, 600 + midi*32);
  bp.Q.value = 0.7;
  const g = AC.createGain();
  g.gain.value = vol * 0.06;

  src.connect(bp); bp.connect(g); g.connect(out);
  src.start(at); src.stop(at + 0.05);
}

/* ══ 倍音の一覧を組み立てる ══
   鳴らす側と測る側の両方がここを使う。音の中身を数値で確かめられる。 */
function pianoPartials(midi){
  const f0  = 440 * Math.pow(2, (midi - 69) / 12);
  const B   = pianoB(midi);
  const t60 = pianoDecay(midi);
  const nH  = Math.max(4, Math.min(14, Math.round(6000 / f0)));
  const norm = Math.sqrt(1 + B);

  const out = [];
  let sum = 0;
  for(let n=1; n<=nH; n++){
    const fn = f0 * n * Math.sqrt(1 + B*n*n) / norm;
    if(fn > 17000) break;
    const amp = Math.pow(n, -1.2);
    if(amp < 0.02) break;
    out.push({ n:n, f:fn, amp:amp, d:t60/(1 + (n-1)*0.5),
               ph:Math.random()*Math.PI*2 });
    sum += amp;
  }
  /* ══ 総和で正規化する ══
     倍音を足した物の大きさは本数で変わる。正規化しないと、
     低い音（倍音が多い）だけが大きく鳴る。 */
  out.forEach(p=> p.amp /= sum);
  return out;
}

/* ══ 一音鳴らす ══
   pluck と同じ形で呼べる： (at, midi, vol, cut)
   midi は小数でよい。cut は「鍵を離す時刻」（秒）。 */
function piano(at, midi, vol, cut){
  if(!AC) return null;
  const out = MASTER;
  if(!out) return null;

  const v    = (vol == null ? 1 : vol);
  const t60  = pianoDecay(midi);
  const life = (cut && cut > 0) ? Math.min(t60, cut) : t60;
  const ps   = pianoPartials(midi);

  /* ══ 鍵を離す処理は、倍音の減衰とは別に掛ける ══
     以前は倍音ごとの減衰時間そのものを cut で頭打ちにしていた。
     すると cut が短い時、**全ての倍音が同じ速さで消える。**
     高い倍音が先に消えるというピアノらしさの核心が失われ、
     オルガンのような平板な音になっていた。

     倍音は自然な速さで消えるままにし、後段の一つの摘みで
     全体を落とす。実物のダンパーと同じ働きである。 */
  const rel = AC.createGain();
  rel.gain.setValueAtTime(1, at);
  if(life < t60){
    rel.gain.setValueAtTime(1, at + life);
    rel.gain.linearRampToValueAtTime(0.0001, at + life + 0.07);
  }
  rel.connect(out);

  const bus = AC.createGain();
  bus.gain.value = v * 0.55;
  bus.connect(rel);

  pianoHammer(at, v, midi, bus);

  const endAt = (life < t60) ? (at + life + 0.12) : null;

  ps.forEach(p=>{
    const osc = AC.createOscillator();

    /* 倍音ごとに位相をずらす。すべて位相ゼロで立ち上げると
       発音の瞬間に山が重なり、音の頭が硬くなる。
       実物の弦は互いに無関係な位相で振動している。 */
    try{
      const w = AC.createPeriodicWave(
        new Float32Array([0, Math.cos(p.ph)]),
        new Float32Array([0, Math.sin(p.ph)]),
        { disableNormalization:true });
      osc.setPeriodicWave(w);
    }catch(_){ osc.type = 'sine'; }
    osc.frequency.value = p.f;

    const atk = 0.006 + 0.004 / p.n;
    const g   = AC.createGain();
    const t1  = at + atk;
    const t2  = t1 + p.d * 0.18;
    const t3  = t1 + p.d;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(p.amp, t1);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, p.amp * 0.32), t2);
    g.gain.exponentialRampToValueAtTime(0.0001, t3);

    osc.connect(g); g.connect(bus);
    osc.start(at);
    osc.stop(endAt ? Math.min(t3 + 0.05, endAt) : t3 + 0.05);
  });

  return { at:at, midi:midi, sec:life };
}

/* ══════════════════════════════════════════════════════════════
   楽器の切り替え

   出題側はここだけを呼ぶ。ギターとピアノの違いはこの中で吸収する。
   ══════════════════════════════════════════════════════════════ */
const INST_STORE = 'mockingbird:ear:inst';

function loadInst(){
  try{ return localStorage.getItem(INST_STORE) === 'piano' ? 'piano' : 'guitar'; }
  catch(_){ return 'guitar'; }
}
function saveInst(v){
  try{ localStorage.setItem(INST_STORE, v); }catch(_){}
}

let INST = loadInst();

/* ══════════════════════════════════════════════════════════════
   音の大きさ

   道筋を二つに分ける。**問題の音は MASTER を通り、正解の音は
   その外を通って直に出口へ向かう。** 同じ道を通していると、
   問題の音を絞った時に正解の音まで一緒に小さくなる。

   これは記録ではなく設定なので、「記録を消してはじめから」では消えない。
   ══════════════════════════════════════════════════════════════ */
const VOL_STORE = 'mockingbird:ear:vol';

function loadVol(){
  const cap = v => (typeof v === 'number' && v >= 0 && v <= 1) ? v : 1;
  try{
    const o = JSON.parse(localStorage.getItem(VOL_STORE) || '{}');
    return { q:cap(o.q), se:cap(o.se) };
  }catch(_){ return { q:1, se:1 }; }
}
function saveVol(){ try{ localStorage.setItem(VOL_STORE, JSON.stringify(VOL)); }catch(_){} }

let VOL = loadVol();

function applyVol(){
  if(MASTER) MASTER.gain.value = 0.9 * VOL.q;
  if(SEG)    SEG.gain.value    = VOL.se;
}

function setInst(v){
  INST = (v === 'piano') ? 'piano' : 'guitar';
  saveInst(INST);
}

/* ══════════════════════════════════════════════════════════════
   1音ずつ音色を変える

   上級では「1つめと2つめで音色が違う」問いを出す。慣れた音色に
   頼れなくなり、耳は音高そのものを聴くようになる。

   ══ どこまで分けられるか ══
   ギターの音は二段でできている：

     ① 弦そのものの作り  … 音を予約した時点で決まる → 1音ずつ変えられる
     ② アンプの歪み・箱鳴り … 全弦を混ぜたあとに一括で掛かる
                              → 鳴らす時に働くので **1音ずつは変えられない**

   ゆえに歪み系（クランチ／ドライブ／ハイゲイン／超ハイゲイン）は、
   2音とも同じ音色の時にしか使えない。混ぜると後から指定した側の
   歪みが両方に掛かる。

   ピアノはギターの道を通らず出口へ直に繋がっているので、
   **ギターとピアノの組み合わせだけは完全に分けられる。**
   最も確実で、最も差が大きい。
   ══════════════════════════════════════════════════════════════ */

/* ══ 1音ずつ混ぜて使える声 ══
   ミュートは入れない。ブリッジミュートは持続がほとんどなく、
   **度数を測る材料にならない。** 鳴った瞬間に消える音では、
   高さを聴き取る前に音が無くなる。 */
const MIXABLE = [
  { id:'piano', label:'ピアノ',           amp:false },
  { id:'steel', label:'アコースティック', amp:true  },
  { id:'nylon', label:'ナイロン',         amp:true  },
  { id:'clean', label:'エレキ',           amp:true  }
];

/* 2音とも同じ時にだけ使える声（歪みは混ぜられない） */
const SOLO_ONLY = [
  { id:'crunch', label:'クランチ' },
  { id:'drive',  label:'ドライブ' },
  { id:'metal',  label:'ハイゲイン' }
];

function voiceLabel(id){
  const all = MIXABLE.concat(SOLO_ONLY);
  for(const v of all) if(v.id === id) return v.label;
  return id === 'guitar' ? 'ギター' : id;
}

/* ══════════════════════════════════════════════════════════════
   楽器の音量を揃える

   実際に書き出して測ったところ、**ピアノがギターより平均8デシベル
   大きかった。** 音色を切り替えるたびに音量が変わっては、聴き比べの
   道具として使えない。

   さらにギターは、高い音ほど小さくなる癖を持っていた（半音あたり
   0.30デシベル、2オクターヴで6デシベル）。**これは高低を問う段で
   命取りになる。** 高い音が小さいと決まっていれば、高さではなく
   大きさで答えられてしまう。ピアノの傾きは0.10で、ほぼ平ら。

   そこで二つ掛ける。
     ① 両者を中間で釣り合わせる（ギターを上げ、ピアノを下げる）
     ② ギターだけ、高い音ほど持ち上げて傾きを打ち消す

   ピアノを下げる側にも意味がある。測った和音の頂点は 1.04 で、
   **すでに歪む一歩手前だった。**
   ══════════════════════════════════════════════════════════════ */
const GTR_TRIM   = 1.585;    /* +4.0dB */
const PIANO_TRIM = 0.631;    /* -4.0dB */
const GTR_TILT   = 0.301;    /* 半音あたり何デシベル持ち上げるか */

/* ══ 音色ごとの釣り合い ══
   ギターの音色は、作りがそれぞれ違う。書き出して測ったところ、
   **エレキは既定のギターより10デシベル大きく、ピアノとは
   9デシベル離れていた。** 楽器が交互に鳴る段では、片方だけが
   前に出て、音の高さより先に大きさが耳につく。

   さらにエレキは高い音で頂点が 1.83 まで達しており、**すでに
   歪んでいた。** 下げる側の手当てでもある。

   数はすべて、C3・C4・C5 の3点を書き出して測った平均から出した。
   耳が大きさを判ずるのは音の頭であるから、**頭の0.3秒**を揃えている。 */
const VOICE_TRIM = {
  steel : 0.42,   /* アコースティック  -7.6dB */
  nylon : 0.48,   /* ナイロン          -6.4dB */
  clean : 0.33,   /* エレキ            -9.6dB */
  crunch: 1.00    /* クランチ           0.0dB */
  /* 歪みの深い音色（ドライブ・ハイゲイン）はここに置いていない。
     波形を潰して作る音であるから、**入り口を上げても出口はほとんど
     大きくならない**（測っても 0.3dB しか動かなかった）。
     いまの段では使っていないので、支障もない。 */
};

function instGain(v, midi, vol){
  const base = (vol == null ? 1 : vol);
  if(v === 'piano') return base * PIANO_TRIM;
  const tilt = Math.pow(10, (((midi == null ? 60 : midi) - 60) * GTR_TILT) / 20);
  /* 持ち上げすぎて歪まぬよう、上下2オクターヴ分で頭打ちにする */
  return base * GTR_TRIM * Math.min(Math.max(tilt, 0.66), 1.52) * (VOICE_TRIM[v] || 1);
}

/* 出題側はこれを使う。pluck と同じ引数で呼べる。
   opt.v に声を指定すると、その1音だけがその音色で鳴る。
   指定がなければ画面で選ばれている楽器に従う。 */
function note(at, midi, vol, cut, opt){
  opt = opt || {};
  const v = opt.v || INST;
  /* 録音の音が使える時はそちらで鳴らす。使えなければ下の合成音へ */
  const r = smpNote(at, midi, vol, cut, opt, v);
  if(r) return r;
  const g = instGain(v, midi, vol);

  if(v === 'piano') return piano(at, midi, g, cut);

  /* ギターの音色は予約の時点で弦の作りに焼き込まれる。
     ここで差し替えれば、この1音だけがその音色になる。 */
  if(v && v !== 'guitar'){ try{ SND.set({ tone:v }); }catch(_){} }
  return pluck(at, midi, g, cut, opt);
}


/* ══════════════════════════════════════════════════════════════
   録音の音（共通の楽器の音 design-system/v1/sound.js）

   合成音の代わりに、実際の楽器を録音した音で鳴らす。
   **読み込めない時（通信がない、置き場がない）は、これまでの合成音のまま。**
   読み込みが済むまでの間も合成音で鳴る。

   ══ 声と録音の対応 ══
     ギター（画面の楽器）・アコースティック … アコギ
     ナイロン                               … ナイロン
     エレキ                                 … エレキ
     クランチ・ドライブ・ハイゲイン         … エレキの録音を、今のアンプに通して歪ませる
     ピアノ                                 … ピアノ

   録音には楽器の胴の響きがすでに入っているので、歪み以外はアンプを通さず
   出口（MASTER）へ直に送る。合成の箱鳴りを重ねると、響きが二重になる。

   ══ 音量 ══
   録音は1音ごとの大きさを sound.js 側で揃えてある（鳴り始め0.3秒）。
   **高低を問う段で、大きさから答えが読めないようにするため。**
   合成音で掛けていた「高い音ほど持ち上げる」手当ては要らない。
   ここでは、合成音と同じ大きさに釣り合わせる倍率だけを掛ける。
   ══════════════════════════════════════════════════════════════ */
const SMP_INST = { guitar:'acoustic', steel:'acoustic', nylon:'nylon', clean:'electric',
                   crunch:'electric', drive:'electric', metal:'electric', piano:'piano' };
const SMP_AMP  = { crunch:true, drive:true, metal:true };
let   SMP_TRIM   = 1.324;  /* 合成音との釣り合い（4つの声の C3・C4・C5 を鳴らして測った平均） */
let   SMP_AMP_IN = 2.941;  /* アンプに入れる大きさ（合成の弦と同じ強さで歪むように。入口で測った平均） */
/* 高さによる大きさの傾きを打ち消す（デシベル／半音）。
   音域を3半音おきに鳴らして測った傾きの逆。どれも2オクターブで2デシベル未満と小さいが、
   **高低を問う段では、系統的な傾きは小さくても答えの手がかりになる。** */
const SMP_TILT = {"steel": 0.062, "piano": -0.017, "nylon": -0.026, "clean": 0.014};
const SMP_LAST = new Map();   /* 弦ごとの最後の音。同じ弦を弾けば前の音は止まる */
let   SMP_ON = true;          /* 試験用。false にすると合成音に戻る */

function smpInit(){
  if(smpInit.done || !AC || !window.DS || !DS.sound) return;
  smpInit.done = true;
  try{
    DS.sound.use({ context:AC, output:MASTER });
    DS.sound.load(['acoustic','nylon','electric','piano']).then(smpCredits).catch(function(){});
  }catch(_){}
}
function smpReady(v){
  const inst = SMP_INST[v];
  return !!(SMP_ON && inst && window.DS && DS.sound && DS.sound.isReady(inst));
}
function smpNote(at, midi, vol, cut, opt, v){
  if(!AC || !smpReady(v)) return null;
  /* 弦の技（ハーモニクス・チョーキング等）は録音では作れないので合成音に任せる */
  if(opt.harm || opt.pm || opt.from || opt.glide || opt.back || opt.vib) return null;
  if(typeof window!=='undefined' && window.__pluckLog) window.__pluckLog.push({at, midi});
  let dest = MASTER, g = vol * SMP_TRIM * Math.pow(10, ((SMP_TILT[v==='guitar'?'steel':v] || 0) * ((midi == null ? 60 : midi) - 60)) / 20);
  if(SMP_AMP[v]){
    try{ SND.set({ tone:v }); }catch(_){}
    dest = guitarBus() || MASTER;
    g = vol * SMP_AMP_IN;
  }
  const s = (opt.str != null && opt.str >= 0) ? opt.str : null;
  if(s != null){ const p = SMP_LAST.get(s); if(p) try{ p.stop(Math.max(at, AC.currentTime)); }catch(_){} }
  const h = DS.sound.play(SMP_INST[v], midi, { time:at, vel:Math.sqrt(Math.max(0, g)),
                                               dur:(cut > 0 ? cut : null), release:0.06, dest:dest });
  if(s != null) SMP_LAST.set(s, h);
  return h;
}
/* 出典の表記。ナイロン（CC BY-SA 3.0）を使うので載せる */
function smpCredits(){
  const el = document.getElementById('sndcredits');
  if(el && window.DS && DS.sound && DS.sound.creditsHtml) el.innerHTML = DS.sound.creditsHtml(['acoustic','nylon','electric','piano']);
}

/* ══════════════════════════════════════════════════════════════
   鍵盤の図

   この道具の答え合わせは、すべてこの図に集まる。
   抽象的な点の並びではなく、**鳴った音がどの鍵かとして直に見える。**

     音名当て … 答えそのものが鍵
     和音     … 構成音の並びが形として見える
     度数     … 鍵と鍵の隔たりが見える
     上下判定 … 左右の位置が高さ

   ══ 時間の扱い ══
   鍵盤は高さを表す物差しであって、時間の軸を持たない。
   同時に鳴る音が混ざる問い（和音・進行）では、
   **まとまりごとに鍵盤を積み重ねる。**
   単音が順に鳴るだけなら、一つの鍵盤に番号を振れば足りる。

   ══ セントは鍵盤では表せない ══
   半音の百分の一は鍵と鍵の間に沈む。ズレを問う段は
   チューナーの針に置き換える。
   ══════════════════════════════════════════════════════════════ */

const WHITE_PC = [0,2,4,5,7,9,11];
const isWhite  = m => WHITE_PC.indexOf(((Math.round(m) % 12) + 12) % 12) >= 0;

/* ══ 描く範囲 ══
   必ず**ドから**始め、2オクターブを基本とする。
   問いごとに端が動くと、鍵の位置が毎回ずれて比べられない。
   ドに揃えておけば、どの図も同じ物差しとして読める。

   和音や進行の段だけは音が3オクターブ近くに広がるので、
   収まらない時にオクターブ単位で広げる。ドから始まる点は変わらない。 */
function keyRange(midis){
  const lo0 = Math.floor(Math.min.apply(null, midis));
  const hi0 = Math.ceil (Math.max.apply(null, midis));
  const lo  = lo0 - (((lo0 % 12) + 12) % 12);   /* 直下のド */
  let   hi  = lo + 23;                          /* 2オクターブ（上のシまで）*/
  while(hi < hi0) hi += 12;
  return [lo, hi];
}

function whiteCount(lo, hi){
  let n = 0;
  for(let m = lo; m <= hi; m++) if(isWhite(m)) n++;
  return n;
}

/* 鍵の位置。黒鍵は白鍵の境目にまたがる */
function keyBox(midi, lo, w, H){
  let n = 0;
  for(let m = lo; m < midi; m++) if(isWhite(m)) n++;
  if(isWhite(midi)) return { x:n*w, w:w, h:H, black:false };
  const bw = w * 0.60;
  return { x:n*w - bw/2, w:bw, h:H*0.62, black:true };
}

/* ══ 鳴った順に鍵を灯す ══
   耳で聴いたものを、目で もう一度なぞる。飾りではなく、教える動き。
   一度に全部を光らせては、順序という情報が落ちる。
   動きを嫌う設定の端末では、待たずに全部を灯す。 */
function litInOrder(svg, delayStep){
  const still = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(still) return;

  /* 鍵と、その上の番号は組で扱う。
     別々に扱うと、**まだ灯っていない鍵の番号だけが先に見えて**
     順序を先に明かしてしまう。 */
  const els = [].slice.call(svg.querySelectorAll('[data-i]'));
  if(!els.length) return;
  els.forEach(el=>{
    const i = parseInt(el.getAttribute('data-i'), 10) || 1;
    el.classList.add('pend');
    setTimeout(()=> el.classList.remove('pend'), 60 + (i-1) * delayStep);
  });
}

/* 鍵盤を一台描く。marks は [{midi, num}] */
function kbSvg(lo, hi, marks, W, H){
  const svg = document.createElementNS(NS,'svg');
  const nW  = whiteCount(lo, hi);
  const w   = W / nW;
  svg.setAttribute('viewBox','0 0 ' + W + ' ' + (H + 13));
  svg.setAttribute('class','kb');
  const el = (n,a,p)=>{ const e=document.createElementNS(NS,n);
    for(const k in a) e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e; };

  const hit = {};
  marks.forEach(mk=> hit[Math.round(mk.midi)] = mk);

  /* 白鍵を先に敷き、黒鍵をその上へ */
  for(const black of [false, true]){
    for(let m = lo; m <= hi; m++){
      if(isWhite(m) === black) continue;
      const b  = keyBox(m, lo, w, H);
      const on = hit[m];
      const seat = on ? String(on.num || 1) : '';
      el('rect',{ x:b.x.toFixed(2), y:0, width:b.w.toFixed(2), height:b.h.toFixed(2),
                  rx:Math.min(2.4, b.w/5).toFixed(2),
                  'data-i':seat,
                  class:'key ' + (black ? 'kb-black' : 'kb-white') + (on ? ' on' : '') });
      if(on && on.num != null){
        el('text',{ x:(b.x + b.w/2).toFixed(2), y:(b.h - 6).toFixed(2),
                    'data-i':seat, class:'kbnum',
                    'text-anchor':'middle' }).textContent = on.num;
      }
    }
  }
  /* 鍵の奥のフェルト */
  el('rect',{ x:0, y:-3, width:W, height:3, class:'felt' });
  return svg;
}

/* ══ チューナーの針 ══
   ズレを問う段のための図。目盛りは ±50 セント。 */
function tunerSvg(cents, W){
  const H = 112;
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 ' + W + ' ' + H);
  svg.setAttribute('class','tuner');
  const el = (n,a)=>{ const e=document.createElementNS(NS,n);
    for(const k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; };

  /* 針の届く高さと数値の位置が重ならないよう、腕を短く取る */
  const cx = W/2, cy = H - 10, R = H - 42;
  const ang = c => (-Math.PI/2) + (Math.max(-50, Math.min(50, c)) / 50) * (Math.PI/3);
  const pt  = (c,r)=> [cx + Math.cos(ang(c))*r, cy + Math.sin(ang(c))*r];

  /* 目盛り */
  [-50,-40,-30,-20,-10,0,10,20,30,40,50].forEach(c=>{
    const big = (c % 25 === 0);
    const a = pt(c, R - (big ? 13 : 7)), b = pt(c, R);
    el('line',{ x1:a[0].toFixed(1), y1:a[1].toFixed(1), x2:b[0].toFixed(1), y2:b[1].toFixed(1),
                class:'tick' + (c === 0 ? ' zero' : '') });
    /* 数字は両端だけ。中央は真鍮の目盛りそのものが基準を示す */
    if(Math.abs(c) === 50){
      const t = pt(c, R + 11);
      el('text',{ x:t[0].toFixed(1), y:(t[1]+3).toFixed(1), class:'tlab',
                  'text-anchor':'middle' }).textContent = (c > 0 ? '+50' : '-50');
    }
  });

  /* 針 */
  const n = pt(cents, R - 6);
  el('line',{ x1:cx, y1:cy, x2:n[0].toFixed(1), y2:n[1].toFixed(1),
              class:'needle' + (Math.abs(cents) < 0.5 ? ' ok' : '') });
  el('circle',{ cx:cx, cy:cy, r:4.5, class:'pivot' });
  el('text',{ x:cx, y:19, class:'tval', 'text-anchor':'middle' })
    .textContent = (Math.abs(cents) < 0.5) ? 'ぴったり'
                 : ((cents > 0 ? '+' : '') + Math.round(cents) + ' セント');
  return svg;
}

/* ══════════════════════════════════════════════════════════════
   答え合わせの図を組み立てる
   ══════════════════════════════════════════════════════════════ */
function drawFigure(Q){
  const box = $('figure');
  box.innerHTML = '';
  const seq = Q && Q.seq;
  if(!seq || !seq.length) return;

  /* ズレを問う段はチューナー */
  if(Q.fig === 'tuner'){
    box.appendChild(tunerSvg(Q.cents || 0, 300));
    return;
  }

  /* 同時に鳴る音をまとめる */
  const group = [];
  seq.slice().sort((a,b)=> a.t - b.t).forEach(e=>{
    const g = group[group.length-1];
    if(g && Math.abs(e.t - g.t) < 0.15) g.notes.push(e);
    else group.push({ t:e.t, notes:[e] });
  });

  const chordy = group.some(g=> g.notes.length > 1);
  const [lo, hi] = keyRange(seq.map(e=> e.m));

  if(!chordy){
    /* 単音が順に鳴っただけ。一台に番号を振る */
    const marks = group.map((g,i)=> ({ midi:g.notes[0].m,
                                       num: group.length > 1 ? (i+1) : null }));
    const svg = kbSvg(lo, hi, marks, 300, 72);
    box.appendChild(svg);
    litInOrder(svg, 170);
    return;
  }

  /* 和音が混ざる。まとまりごとに一台ずつ積む */
  group.forEach((g,i)=>{
    const row = document.createElement('div');
    row.className = 'kbrow';
    if(group.length > 1){
      const n = document.createElement('span');
      n.className = 'kbrown'; n.textContent = (i+1);
      row.appendChild(n);
    }
    const wrap = document.createElement('div');
    wrap.className = 'kbwrap';
    const svg = kbSvg(lo, hi, g.notes.map(e=> ({ midi:e.m, num:null })),
                      300, group.length > 2 ? 40 : 62);
    wrap.appendChild(svg);
    row.appendChild(wrap);
    row.classList.add('pendrow');
    setTimeout(()=> row.classList.remove('pendrow'), 60 + i * 320);
    box.appendChild(row);
  });
}

/* ══════════════════════════════════════════════════════════════
   選択肢を鍵盤で出す（音名当て）

   格子に並べた12個のボタンより、本物の並びのほうが速く正確に押せる。
   黒鍵が白鍵の間の上段にあるという知識が、そのまま使えるからである。
   ══════════════════════════════════════════════════════════════ */
const KEY_ORDER = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

function keyOptions(options, onPick){
  const box = document.createElement('div');
  box.className = 'keyopts';

  const whites = options.filter(o=> o.length === 1);
  const blacks = options.filter(o=> o.length > 1);
  const wN = whites.length;

  whites.forEach((name,i)=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt keyw';
    b.style.left  = (i * 100 / wN) + '%';
    b.style.width = (100 / wN) + '%';
    b.textContent = name;
    b.onclick = ()=> onPick(name, b);
    box.appendChild(b);
  });

  /* 黒鍵は白鍵の境目にまたがる。C♯ は C と D の間 */
  blacks.forEach(name=>{
    const idx = KEY_ORDER.indexOf(name);
    const below = KEY_ORDER[idx-1];              /* すぐ下の白鍵 */
    const wi = whites.indexOf(below);
    if(wi < 0) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt keyb';
    const unit = 100 / wN;
    b.style.left  = ((wi+1) * unit - unit*0.30) + '%';
    b.style.width = (unit * 0.60) + '%';
    b.dataset.name = name;
    b.appendChild(withAccidental(name, 12));
    b.onclick = ()=> onPick(name, b);
    box.appendChild(b);
  });

  return box;
}

/* 記号を一つ描く。高さを指定すると幅は比で決まる */
function glyph(name, h, cls){
  const g = GLYPH[name]; if(!g) return null;
  const svg = document.createElementNS(NS,'svg');
  const w = h * g.w / g.h;
  svg.setAttribute('viewBox', '0 0 ' + g.w + ' ' + g.h);
  svg.setAttribute('class', 'gly ' + (cls || ''));
  svg.setAttribute('aria-hidden','true');
  svg.style.height = h + 'px';
  svg.style.width  = w.toFixed(1) + 'px';
  const p = document.createElementNS(NS,'path');
  p.setAttribute('d', g.d);
  svg.appendChild(p);
  return svg;
}

/* 「D♭」のような文字列を、本物の記号を混ぜた並びに組み直す */
function withAccidental(text, h){
  const frag = document.createDocumentFragment();
  const m = /^(.+?)([♭♯♮])$/.exec(text);
  if(!m){ frag.appendChild(document.createTextNode(text)); return frag; }
  frag.appendChild(document.createTextNode(m[1]));
  const name = { '♭':'flat', '♯':'sharp', '♮':'natural' }[m[2]];
  const g = glyph(name, h || 15, 'acc');
  if(g) frag.appendChild(g); else frag.appendChild(document.createTextNode(m[2]));
  return frag;
}

/* ══════════════════════════════════════════════════════════════
   得意と苦手の図

   ══ なぜ最高記録では駄目か ══
   段を進むには8割（上級は9割）の合格が要る。ゆえに**進んだ段は
   どれも8〜10割で埋まる。** 最高記録だけを描けば図はほぼ満杯の
   多角形になり、苦手も得意も見えない。
   実力を映すのは直近の成績のほうである。

   外側の輪郭に最高記録、内側の面に直近3回の平均を重ねる。
   **二つの隔たりが、そのまま伸びしろになる。**

   ══ 未挑戦を0として黙って描かない ══
   やっていないだけの軸が、苦手として現れてしまう。
   その軸は破線にし、添え字も控えめにして区別する。
   ══════════════════════════════════════════════════════════════ */

/* 軸。コースをまたいで、能力ごとに段を束ねる */
const AXES = [
  { name:'音の数',   pick:[['basic',1],['basic',6]] },
  { name:'高低',     pick:[['basic',2],['basic',3],['basic',4],['basic',5],['adv',18]] },
  { name:'ピッチ',   pick:[['adv',1],['adv',2],['adv',3],['adv',4],['adv',5],['adv',6]] },
  { name:'音程',     pick:[['adv',11],['adv',12],['adv',19],['adv',22],['adv',23]] },
  { name:'和音',     pick:[['basic',8],['adv',7],['adv',8],['adv',9],['adv',10]] },
  { name:'並び',     pick:[['basic',7],['adv',13],['adv',14],['adv',15],['adv',24],['adv',25]] },
  { name:'音名',     pick:[['adv',16],['adv',17],['adv',20],['adv',21]] }
];

const mean = a => a.reduce((x,y)=> x+y, 0) / a.length;

/* 各軸の、最高記録と直近平均を集める */
function axisScores(){
  const store = {};
  COURSES.forEach(c=> store[c.id] = { s:readStore(c), stages:c.stages });

  return AXES.map(ax=>{
    const bests = [], recents = [];
    ax.pick.forEach(([cid, no])=>{
      const g = store[cid]; if(!g) return;
      const st = g.stages[no-1]; if(!st) return;
      const b = g.s.best[no];
      if(b != null) bests.push(b / st.n);
      const r = g.s.recent[no];
      if(r && r.length) recents.push(mean(r));
    });
    /* デイリーで解いた分も、同じ軸の直近成績として混ぜる */
    const dr = (typeof loadDaily === 'function') ? (loadDaily().axis[ax.name] || []) : [];
    const all = recents.concat(dr);
    /* ══ 挑戦済みかどうか ══
       段の最高記録だけを見ると、**デイリーでだけ練習した力が
       「未挑戦」のまま**になる。成績が一つでもあれば挑戦済みとする。 */
    return {
      name: ax.name,
      tried: bests.length > 0 || all.length > 0,
      best:   bests.length ? mean(bests) : 0,
      recent: all.length   ? mean(all)   : 0
    };
  });
}

function drawRadar(){
  const box = $('radar');
  if(!box) return;
  box.innerHTML = '';

  const data = axisScores();
  if(!data.some(d=> d.tried)){
    const p = document.createElement('p');
    p.className = 'radarnote';
    p.textContent = '段に挑戦すると、得意と苦手が図になります。';
    box.appendChild(p);
    return;
  }

  const W = 340, H = 272, cx = W/2, cy = 130, R = 88;
  const N = data.length;
  const ang = i => -Math.PI/2 + i * 2*Math.PI/N;
  const pt  = (i, v) => [ cx + Math.cos(ang(i)) * R * v,
                          cy + Math.sin(ang(i)) * R * v ];

  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class','radar');
  const el = (n,a)=>{ const e=document.createElementNS(NS,n);
    for(const k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; };

  /* 目盛りの輪 */
  [0.25, 0.5, 0.75, 1].forEach(v=>{
    const d = data.map((_,i)=>{ const p = pt(i,v);
      return (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ') + ' Z';
    el('path',{ d:d, class:'rring' + (v === 1 ? ' edge' : '') });
  });

  /* 軸の線と、その名 */
  data.forEach((d,i)=>{
    const p = pt(i, 1);
    el('line',{ x1:cx, y1:cy, x2:p[0].toFixed(1), y2:p[1].toFixed(1),
                class:'rspoke' + (d.tried ? '' : ' untried') });
    const l = pt(i, 1.20);
    const t = el('text',{ x:l[0].toFixed(1), y:(l[1]+4).toFixed(1),
                          class:'rlab' + (d.tried ? '' : ' untried'),
                          'text-anchor': Math.abs(l[0]-cx) < 10 ? 'middle'
                                        : (l[0] > cx ? 'start' : 'end') });
    t.textContent = d.name;
  });

  /* ══ 未挑戦の軸を通さない ══
     0として結ぶと、**やっていないだけの軸が「0点」として現れる。**
     データが無いことと0点であることは違う。
     挑戦した軸だけを結び、未挑戦の軸は破線の骨として残す。 */
  const tried = data.map((d,i)=> [d,i]).filter(([d])=> d.tried);
  const poly = key => tried.map(([d,i],k)=>{ const p = pt(i, d[key]);
    return (k?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ')
    + (tried.length > 2 ? ' Z' : '');

  el('path',{ d:poly('best'),   class:'rbest' });
  el('path',{ d:poly('recent'), class:'rnow'  });

  tried.forEach(([d,i])=>{
    const p = pt(i, d.recent);
    el('circle',{ cx:p[0].toFixed(1), cy:p[1].toFixed(1), r:3.6, class:'rdot' });
  });

  /* 凡例。軸の名とぶつからないよう、図の下に置く */
  const ly = H - 12;
  el('line',{ x1:78, y1:ly-4, x2:100, y2:ly-4, class:'rbest legline' });
  el('text',{ x:106, y:ly, class:'rleg' }).textContent = '最高';
  el('rect',{ x:170, y:ly-9, width:22, height:8, class:'rnow' });
  el('text',{ x:198, y:ly, class:'rleg' }).textContent = '直近3回';

  box.appendChild(svg);

  const un = data.filter(d=> !d.tried).length;
  if(un){
    const p = document.createElement('p');
    p.className = 'radarnote';
    p.textContent = '破線の軸はまだ挑戦していません。';
    box.appendChild(p);
  }
}

/* ══════════════════════════════════════════════════════════════
   デイリー — 混ぜて10問

   ══ 出す範囲は実力の内側に留める ══
   全24段から均等に選ぶと、初級の段2までしか進んでいない生徒に
   上級のコード進行が出る。**手も足も出ず、心が折れるだけ。**
   合格した段と、いま挑戦中の段までに限る。

   ══ 同じ日は同じ10問 ══
   出題は各段の make() に委ねてあり、その中は Math.random を使う。
   ゆえに日付を種にして **Math.random そのものを差し替える。**
   終わったら必ず元へ戻す（戻し忘れると、以後すべての出題が
   同じ並びを繰り返す）。

   だが種だけでは足りない。**出せる段の顔ぶれが変われば問いも変わる。**
   その日のうちに段を一つ合格しただけで「今日の10問」が別物になる。
   ゆえに組み上がった10問そのものを預かり、その日はそれを使う
   （todaySet）。日付が変われば預かり物は捨てる。

   練習は種を与えず、毎回ちがう10問。記録には残さない。
   ══════════════════════════════════════════════════════════════ */

const DAILY_STORE = 'mockingbird:ear:daily';
const DAILY_N = 10;

/* 種つきの乱数（mulberry32） */
function seeded(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function todayKey(d){
  const t = d || new Date();
  return t.getFullYear() + '-' +
         String(t.getMonth()+1).padStart(2,'0') + '-' +
         String(t.getDate()).padStart(2,'0');
}
function seedOf(key){
  let h = 2166136261;
  for(let i=0;i<key.length;i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* いま出してよい段。合格した段と、挑戦中の段まで */
function dailyPool(){
  const pool = [];
  COURSES.forEach(c=>{
    if(!c.stages) return;
    const s = readStore(c);
    c.stages.forEach(st=>{
      const done = (s.best[st.no] || 0) >= passLine(st);
      const open = c.free ? (s.best[st.no] != null) : (st.no <= s.open);
      if(done || open) pool.push({ cid:c.id, stage:st });
    });
  });
  return pool;
}

/* ══ 10問を組む ══
   seed を与えれば、何度呼んでも同じ並びになる。

   ══ 必ず10問にする ══
   重複を避けながら集めるが、出せる段が少ない時期には
   組み合わせを使い切ることがある。そこで二段構えにする。
     ① 重複を避けて集める
     ② それでも足りなければ、重複を許して10問まで埋める
   「今日の10問」と名乗る以上、9問で返さない。 */
function buildDaily(seed){
  const pool = dailyPool();
  if(!pool.length) return [];

  const orig = Math.random;
  if(seed != null) Math.random = seeded(seed);
  try{
    const used = new Set(), out = [];
    let bag = [], guard = 0;

    const take = (src, q)=>{
      q.src = { cid:src.cid, no:src.stage.no };   /* どの段から来たか。図と軸に要る */
      out.push(q);
    };

    while(out.length < DAILY_N && guard++ < 800){
      if(!bag.length) bag = shuffle(pool.slice());
      const src = bag.pop();
      const q = src.stage.make();
      const s = signOf(q);
      if(used.has(s)) continue;
      used.add(s);
      take(src, q);
    }
    /* ② 重複を許して埋める */
    let fill = 0;
    while(out.length < DAILY_N && fill++ < 200){
      if(!bag.length) bag = shuffle(pool.slice());
      const src = bag.pop();
      take(src, src.stage.make());
    }
    return out;
  } finally {
    Math.random = orig;               /* 必ず戻す */
  }
}

/* ══ その日の出題セットを保存する ══
   日付を種にすれば並びは決まるが、**出せる段の顔ぶれが変われば
   問いも変わる。** その日のうちに段を一つ合格しただけで、
   「今日の10問」が別の10問になってしまう。
   ゆえに種ではなく、組み上がった10問そのものを預かる。

   段は関数を持つので、そのままでは保存できない。
   どの段から来たかだけを数字で控え、読み出す時に引き直す。 */
function stageOf(cid, no){
  const c = COURSES.find(x=> x.id === cid);
  if(!c || !c.stages) return null;
  return c.stages.find(st=> st.no === no) || null;
}

function todaySet(){
  const d = loadDaily();
  const today = todayKey();

  /* 預かった物が今日の分なら、それをそのまま返す */
  if(d.setDate === today && Array.isArray(d.set) && d.set.length === DAILY_N)
    return d.set;

  const list = buildDaily(seedOf(today));
  if(list.length !== DAILY_N) return list;      /* 組めなかった時は預けない */

  d.setDate = today; d.set = list;
  saveDaily(d);
  return list;
}

/* ══ 記録 ══ */
function loadDaily(){
  try{
    const o = JSON.parse(localStorage.getItem(DAILY_STORE) || '{}');
    return { last:o.last || null, ok:o.ok || 0, streak:o.streak || 0, axis:o.axis || {},
             setDate:o.setDate || null, set:Array.isArray(o.set) ? o.set : null };
  }catch(_){ return { last:null, ok:0, streak:0, axis:{}, setDate:null, set:null }; }
}
function saveDaily(d){ try{ localStorage.setItem(DAILY_STORE, JSON.stringify(d)); }catch(_){} }

function yesterdayKey(){
  const t = new Date(); t.setDate(t.getDate() - 1); return todayKey(t);
}

/* 段の名から、レーダーのどの軸に属すかを引く */
function axisOfStage(cid, no){
  for(const ax of AXES)
    for(const [c,n] of ax.pick) if(c === cid && n === no) return ax.name;
  return null;
}

function recordDaily(list, marks){
  const d = loadDaily();
  const today = todayKey();
  if(d.last === today) return d;                 /* 本番は一日一回 */

  d.streak = (d.last === yesterdayKey()) ? d.streak + 1 : 1;
  d.last = today;
  d.ok = marks.filter(Boolean).length;

  /* ══ 能力ごとに集めて図へ返す ══
     混ぜて出すぶん、どの力が落ちているかが最も正直に出る。
     一問ごとに段の記録へ入れると、1問の当たり外れで
     その段の成績が乱高下する。軸ごとに束ねてから入れる。 */
  const tally = {};
  list.forEach((q,i)=>{
    const a = q.src && axisOfStage(q.src.cid, q.src.no);
    if(!a) return;
    (tally[a] = tally[a] || { ok:0, n:0 });
    tally[a].n++; if(marks[i]) tally[a].ok++;
  });
  Object.keys(tally).forEach(a=>{
    const r = (d.axis[a] || []).concat([ +(tally[a].ok / tally[a].n).toFixed(3) ]);
    d.axis[a] = r.slice(-3);
  });

  saveDaily(d);
  return d;
}

}

/* ══ 始める ══ */
const DAILY_STAGE = { no:0, name:'今日の10問', n:DAILY_N, ratio:0.8, kinds:[] };

function startDaily(real){

/* ══════════════════════════════════════════════════════════════
   実戦 — 止まらない出題

   合奏の最中に「もう一度」は言えない。音楽も待ってはくれない。
   ここでは音が自動で鳴り、答えても答えなくても次が来る。

   ══ 画面から消える物 ══
     ・聴くボタン  … 音は自動で鳴る
     ・次の問題へ  … 自ら進む
     ・一問ごとの解説 … 読む時間がない。終わってからまとめて振り返る

   ══ 窓の長さは段ごとに違う ══
   同じ秒数では測れない。理由は二つ。

     ① 鳴り方が違う
        計り始めは **最後の音が鳴り始めた時**。減衰が終わるまでは
        待たない。ギターもピアノも尾を長く引くので、消えるまで待てば
        実戦にならない。

          一つの音・和音 … 鳴った瞬間から
          順に鳴る音     … 最後の音が鳴り始めた時から

        答えるのはいつでもよい。鳴っている最中に分かったならその場で
        押せる。押さえているのは考える時間であって、答える機会ではない。

     ② 選択肢の数が違う
        2択と12択を同じ秒数で測るのは、耳ではなく指を試している。
        選択肢が増えるぶん窓を伸ばす。
   ══════════════════════════════════════════════════════════════ */

const DRILL_N = 10;
const SPEEDS = [
  { id:'slow', label:'ゆっくり', k:1.5 },
  { id:'mid',  label:'ふつう',   k:1.0 },
  { id:'fast', label:'速い',     k:0.7 }
];
const SPEED_STORE = 'mockingbird:ear:speed';

function loadSpeed(){
  try{
    const v = localStorage.getItem(SPEED_STORE);
    return SPEEDS.find(s=> s.id === v) || SPEEDS[1];
  }catch(_){ return SPEEDS[1]; }
}
function saveSpeed(id){ try{ localStorage.setItem(SPEED_STORE, id); }catch(_){} }
let SPEED = loadSpeed();

/* ══ 計り始め ══
   最後の音が鳴り始める時刻。減衰の終わりではない。
   和音は 0.025 秒ずつずらして鳴らしてあるので、その最後の一音を指す。 */
function startSec(q){
  return Math.max.apply(null, q.seq.map(e=> e.t));
}

/* 答える窓の長さ。最後の音が鳴り始めてから測る */
function windowSec(q){
  const base = 2.1 + 0.32 * Math.max(0, q.options.length - 2);
  return Math.max(1.6, Math.min(6.5, base * SPEED.k));
}

/* 実戦の10問。段の持ち問題数（5問の段もある）に関わらず10問組む */
function buildDrill(st){
  const used = new Set(), out = [];
  const kinds = st.kinds || [];
  const quota = [];
  for(let i=0;i<DRILL_N;i++) quota.push(kinds.length ? kinds[i % kinds.length] : null);
  shuffle(quota);
  for(const want of quota){
    const q = drawOne(st, want, used);
    used.add(signOf(q));
    out.push(q);
  }
  return out;
}

/* ══ 進行 ══ */
let drillTimers = [];
function clearDrill(){ drillTimers.forEach(clearTimeout); drillTimers = []; }
function later(fn, ms){ drillTimers.push(setTimeout(fn, ms)); }

function startDrill(st){
  clearDrill();
  leaveHome();
  quiz = { stage:st, list:buildDrill(st), i:0, ok:0, marks:[], drill:true };
  show('home', false); show('result', false); show('quiz', true);
  show('play', false); show('feedback', false); show('drillbar', true);
  $('qnote').textContent = '';
  window.scrollTo(0,0);
  drillStep();
}

function drillStep(){
  const st = quiz.stage;
  Q = quiz.list[quiz.i];
  quiz.answered = false;

  drawInstPicker('inst2');
  $('qstage').textContent = st.name + ' — 実戦（' + SPEED.label + '）';
  $('qcount').textContent = (quiz.i + 1) + ' / ' + DRILL_N;
  $('qask').textContent   = Q.ask;

  const bar = $('bar'); bar.innerHTML = '';
  for(let k=0;k<DRILL_N;k++){
    const d = document.createElement('span');
    d.className = 'tick' + (k < quiz.marks.length ? (quiz.marks[k] ? ' hit' : ' miss') : '')
                + (k === quiz.i ? ' now' : '');
    bar.appendChild(d);
  }

  /* 選択肢は最初から押せる。鳴っている最中に分かったなら、その場で答えてよい */
  const box = $('opts');
  box.className = 'opts ' + (Q.layout || 'plain');
  box.innerHTML = '';
  if(Q.layout === 'keys'){
    box.className = 'opts';
    box.appendChild(keyOptions(Q.options, (name, btn)=> drillAnswer(name, btn)));
  }else{
    Q.options.forEach(op=>{
      const b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      if(Q.layout === 'shape'){
        b.appendChild(shapeGlyph(Q.shapes[op]));
        const t = document.createElement('span'); t.textContent = op; b.appendChild(t);
      }else{ b.textContent = op; }
      b.onclick = ()=> drillAnswer(op, b);
      box.appendChild(b);
    });
  }
  const fill = $('drillfill');
  fill.style.transition = 'none';
  fill.style.width = '100%';

  const st0 = startSec(Q), win = windowSec(Q);
  $('drilllabel').textContent = st0 > 0.3 ? '鳴っています' : 'どうぞ';

  playDrillSound();

  later(()=>{
    $('drilllabel').textContent = 'どうぞ';
    fill.style.transition = 'width ' + win + 's linear';
    fill.style.width = '0%';
  }, (st0 + 0.15) * 1000);

  later(()=>{ if(!quiz.answered) drillAnswer(null, null); },
        (st0 + 0.15 + win) * 1000);
}

async function playDrillSound(){
  const ac = await audioWake();
  if(!ac) return;
  soundStop();
  SND.reset({ tone:'clean', drive:1, body:1, sustain:1, bpm:100 });
  const t0 = ac.currentTime + 0.15;
  try{ Q.seq.forEach(e=> note(t0 + e.t, e.m, 0.92, e.c, { str:e.s, v:e.v })); }
  catch(err){ console.error(err); }
}

function drillAnswer(chosen, btn){
  if(quiz.answered) return;
  quiz.answered = true;
  clearDrill();

  const ok = (chosen === Q.answer);
  if(ok){ quiz.ok++; chime(); }
  quiz.marks.push(ok);
  Q.chosen = chosen;                       /* 振り返りに使う */

  [].forEach.call($('opts').querySelectorAll('.opt'), b=> b.disabled = true);
  if(btn) btn.classList.add(ok ? 'right' : 'wrong');
  const ticks = $('bar').children;
  if(ticks[quiz.i]) ticks[quiz.i].className = 'tick ' + (ok ? 'hit' : 'miss');
  $('drilllabel').textContent = ok ? '正解' : (chosen === null ? '時間切れ' : '不正解');
  $('drillfill').style.transition = 'none';
  $('drillfill').style.width = '0%';

  later(()=>{
    quiz.i++;
    if(quiz.i >= DRILL_N) finishDrill();
    else drillStep();
  }, 480);
}

/* ══ 結果。外した問いだけを鍵盤つきで振り返る ══ */
function finishDrill(){
  clearDrill(); soundStop();
  show('quiz', false); show('result', true);
  show('drillbar', false); show('play', true);
  window.scrollTo(0,0);

  const st = quiz.stage;
  $('rstage').textContent = st.name + ' — 実戦（' + SPEED.label + '）';
  $('judge').textContent = quiz.ok + ' / ' + DRILL_N;
  $('judge').className = quiz.ok >= 8 ? 'ok' : '';
  $('score').textContent = '止まらない出題での成績です';

  const rb = $('rbar'); rb.innerHTML = '';
  quiz.marks.forEach((m,k)=>{
    const d = document.createElement('span');
    d.className = 'rtick ' + (m ? 'hit' : 'miss');
    d.textContent = (k+1);
    rb.appendChild(d);
  });

  const miss = quiz.list.filter((q,i)=> !quiz.marks[i]);
  const box = $('review'); box.innerHTML = '';
  if(miss.length){
    const h = document.createElement('p');
    h.className = 'revhead';
    h.textContent = '外した ' + miss.length + ' 問';
    box.appendChild(h);
    miss.forEach(q=>{
      const c = document.createElement('div');
      c.className = 'revcard';
      const t = document.createElement('p');
      t.className = 'revans';
      t.textContent = (q.chosen === null ? '無回答' : '「' + q.chosen + '」') +
                      ' → 正しくは「' + q.answer + '」';
      c.appendChild(t);
      const n = document.createElement('p');
      n.className = 'revnote'; n.textContent = q.note;
      c.appendChild(n);
      const fig = document.createElement('div');
      fig.className = 'revfig';
      c.appendChild(fig);
      box.appendChild(c);
      const keep = $('figure');
      /* 図を描く関数は #figure に描くので、描いてから移す */
      drawFigure(q);
      while(keep.firstChild) fig.appendChild(keep.firstChild);
    });
  }
  show('review', true);

  $('rnote').textContent = '';
  $('again').textContent = 'もう一度 実戦する';
  $('again').onclick = ()=> startDrill(st);
}

/* ══════════════════════════════════════════════════════════════
   速さを選ぶ

   表に置きっぱなしにすると、実戦を使わない時にも目に入って邪魔になる。
   押した時に選ばせる。

   ══ 秒数を添える ══
   同じ「ふつう」でも、段によって1問あたりの長さは倍以上ちがう。
   選ぶ前に見えていなければ、選びようがない。
   ══════════════════════════════════════════════════════════════ */
function perQuestion(st, speed){
  const keep = SPEED;
  SPEED = speed;
  /* 段によって問いごとの長さが揺れるので、いくつか作って平均を取る */
  let sum = 0, n = 6;
  for(let i=0;i<n;i++){
    const q = st.make();
    sum += startSec(q) + 0.15 + windowSec(q);
  }
  SPEED = keep;
  return sum / n;
}

function openSpeedSheet(st){
  const sheet = $('speedsheet');
  $('sheettitle').textContent = st.name;
  const box = $('sheetopts');
  box.innerHTML = '';
  SPEEDS.forEach(sp=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sheetopt' + (SPEED.id === sp.id ? ' on' : '');
    const l = document.createElement('b'); l.textContent = sp.label;
    const t = document.createElement('i');
    t.textContent = '1問あたり およそ ' + perQuestion(st, sp).toFixed(1) + ' 秒';
    b.appendChild(l); b.appendChild(t);
    b.onclick = ()=>{
      SPEED = sp; saveSpeed(sp.id);
      closeSpeedSheet();
      startDrill(st);
    };
    box.appendChild(b);
  });
  show('speedsheet', true);
  sheet.classList.add('open');
}

function closeSpeedSheet(){
  const sheet = $('speedsheet');
  sheet.classList.remove('open');
  show('speedsheet', false);
}
/* ══════════════════════════════════════════════════════════════
   Mockingbird — 音感トレーニング

   ══ 画面の骨格 ══
   音楽の記法はどれも「高い音は上」で出来ている。この道具の中心は
   そこにあるので、画面もそれに従わせる。

     ・上下を問う段では、選択肢を意味どおりの順に縦に置く
     ・答えたあと、実際に鳴った音の高さを縦の位置で図に示す
     ・段の一覧は縦線でつなぎ、一本道であることを見せる

   ══ 音は、鳴らす前に「並び」として決めておく ══
   各問いは seq（いつ・どの高さ・どの弦）を持つ。鳴らす側はそれを
   予約するだけ。図を描く側は同じ seq を読む。
   **鳴った音と図が食い違わない**のは、出所が一つだからである。

   ══ 表示は答えを漏らしてはならない ══
   以前の作りは、音が鳴り終わるまで「聴く」ボタンを塞いでいた。
   その待ち時間が答えを漏らしていた——鳴り方によって音の長さが
   違えば、耳を使わずとも待ち時間だけで当てられる。

   ゆえに、**鳴っている間の表示は音の長さを示さない。**
   加えて、**一つの段の中では音の長さを必ず揃える。**
   進捗バーは使えない。待ち時間も音の長さから切り離し、一律にする。
   ══════════════════════════════════════════════════════════════ */

const $    = id => document.getElementById(id);
const show = (id,on)=>{ const e=$(id); if(e) e.style.display = on ? '' : 'none'; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const NS   = 'http://www.w3.org/2000/svg';

/* 弾く弦はそろえる。弦が変われば音色も変わり、
   高い低いの前に音色の違いが耳を引く */
const STR = 3;

/* ══ 音の高さの幅 ══
   ここが狭いと問いの総数が足りず、1組の中で同じ問いが繰り返される。
   6通りしか無かった頃は、段8（12通り）で10問組めば
   **99.8%の組に重複が出ていた。** 12通りに広げて元を倍にする。 */
const rootMid = ()=> 53 + Math.floor(Math.random()*12);   /* F3〜E4 */
const rootLow = ()=> 45 + Math.floor(Math.random()*12);   /* A2〜G#3 */

/* seq の一つ分：{ t:鳴らす時刻(秒), m:高さ(MIDI・小数可), s:弦, c:止める秒 } */
const ev = (t,m,s,c,v)=>({ t:t, m:m, s:s, c:c, v:v });   /* v は声（省略なら画面の楽器） */

/* ズレの向きを問う段。ズレの幅と音域だけが違う */
function makeDirection(cents, roots){
  const root = roots();
  const up   = Math.random() < 0.5;
  const off  = (up ? 1 : -1) * cent(pick(cents));
  return {
    ask:'2つめの音は、1つめから',
    layout:'pitch', fig:'tuner', cents: Math.round(off*100),
    options:['高いほうへ','低いほうへ'],
    answer: up ? '高いほうへ' : '低いほうへ',
    note: Math.round(Math.abs(off*100)) + 'セント' + (up ? '高い' : '低い') + 'ほうへ',
    seq:[ ev(0, root, 3, 1.8), ev(1.1, root+off, 3, 3.9) ]
  };
}

/* 上下を問う段は、差の大きさだけが違う。同じ作りを使い回す */
function makeUpDown(gaps, withSame){
  const root = rootMid();
  let second, ans;
  if(withSame && Math.random() < 0.28){
    second = root; ans = '同じ高さ';
  }else{
    const gap = pick(gaps);
    const up  = Math.random() < 0.5;
    second = root + (up ? gap : -gap);
    ans = up ? '高くなった' : '低くなった';
  }
  return {
    ask:'2つめの音は、どうなりましたか',
    layout:'pitch',
    options: withSame ? ['高くなった','同じ高さ','低くなった']
                      : ['高くなった','低くなった'],
    answer:ans,
    note:(second===root) ? 'まったく同じ高さでした'
                         : ('差は ' + Math.abs(second-root) + ' 半音'),
    seq:[ ev(0, root, STR, 1.5), ev(0.95, second, STR, 1.5) ]
  };
}

/* ══ 9つの段 ══
   layout は選択肢の並べ方：
     pitch … 意味どおり縦に（高い答えが上）
     count … 数字を横に大きく
     shape … 輪郭の絵を添えて2列に
     plain … ふつうに縦に               */
const STAGES = [

  { no:1, name:'音はいくつ', hint:'鳴っている音の数を数えます', n:5,
    kinds:['1つ','2つ'],
    make(){
      const two  = Math.random() < 0.5;
      const root = rootMid();
      const iv   = two ? [0, pick([4,5,9])] : [0];
      return {
        ask:'いくつの音が鳴りましたか',
        layout:'count', options:['1つ','2つ'], answer: two ? '2つ' : '1つ',
        note: two ? '2つの音が同時に鳴りました' : '1つだけ鳴りました',
        seq: iv.map((x,k)=> ev(0, root+x, STR-k, 3.0))
      };
    }},

  { no:2, name:'高いか、低いか', hint:'差はとても大きいです', n:5,
    kinds:['高くなった','低くなった'],
    make(){ return makeUpDown([12], false); }},

  { no:3, name:'高いか、低いか（少し近い）', hint:'差が縮まります', n:5,
    kinds:['高くなった','低くなった'],
    make(){ return makeUpDown([5,7], false); }},

  { no:4, name:'高いか、低いか（かなり近い）', hint:'差はさらに縮まります', n:10,
    kinds:['高くなった','低くなった'],
    make(){ return makeUpDown([3,4], false); }},

  { no:5, name:'高いか、低いか、同じか', hint:'「同じ」が加わります', n:10,
    kinds:['高くなった','同じ高さ','低くなった'],
    make(){ return makeUpDown([1,2], true); }},

  { no:6, name:'音はいくつ（3つまで）', hint:'重なった音を数えます', n:10,
    kinds:['1つ','2つ','3つ'],
    make(){
      const n    = pick([1,2,3]);
      const root = rootLow();
      const iv   = { 1:[0], 2:[0,7], 3:[0,4,7] }[n];
      return {
        ask:'いくつの音が重なっていましたか',
        layout:'count', options:['1つ','2つ','3つ'], answer:n+'つ',
        note: n===1 ? '1つだけ鳴りました' : (n+'つの音が同時に鳴りました'),
        seq: iv.map((x,k)=> ev(0, root+x, STR+1-k, 3.2))
      };
    }},

  { no:7, name:'音の並びのかたち', hint:'3つの音が動く向きを聴きます', n:10,
    kinds:['ずっと上がる','ずっと下がる','上がって下がる','下がって上がる'],
    make(){
      const shapes = {
        'ずっと上がる':  [0,5,10],
        'ずっと下がる':  [10,5,0],
        '上がって下がる':[0,9,4],
        '下がって上がる':[9,0,5]
      };
      const keys = Object.keys(shapes);
      const key  = pick(keys), iv = shapes[key], root = rootMid();
      return {
        ask:'3つの音はどう動きましたか',
        layout:'shape', options:keys, answer:key, shapes:shapes,
        note:'3つの音が順に鳴りました',
        seq: iv.map((x,k)=> ev(k*0.8, root+x, STR, 1.3))
      };
    }},

  { no:8, name:'明るいか、暗いか', hint:'和音のひびきを聴きます', n:10,
    kinds:['明るい','暗い'],
    make(){
      const major = Math.random() < 0.5;
      const iv    = major ? [0,4,7,12] : [0,3,7,12];
      const root  = rootLow();
      return {
        ask:'この和音のひびきは',
        layout:'plain', options:['明るい','暗い'],
        answer: major ? '明るい' : '暗い',
        note: major ? 'メジャーコードでした' : 'マイナーコードでした',
        seq: iv.map((x,k)=> ev(k*0.02, root+x, 5-k, 4.0))
      };
    }}
];

const passLine = st => Math.ceil(st.n * (st.ratio || 0.8));

/* ══════════════════════════════════════════════════════════════
   上級編

   ══ うなりで聴く ══
   2つの音がわずかにずれていると、音量がゆっくり脈打つ。これがうなり。
   1秒あたりの回数は2音の周波数の差にそのまま等しい。

   ここに落とし穴がある。**同じセント数でも、低い音ほどうなりが遅い。**
   セントは比なので、440Hz の5セントは 1.27Hz（0.79秒に1回）だが、
   146Hz の5セントは 0.42Hz（2.4秒に1回）にしかならない。
   ギターの減衰は4秒ほどなので、低い音では**うなりを2回数える前に
   音が消える。**

   ゆえに細かいセントを問う段ほど、高めの音を使う。

   ══ 弦を分ける ══
   撥弦の側には「同じ弦を弾けば前の音は止まる」という決まりがある。
   同時に鳴らす2音を同じ弦に置くと、**片方が消えてうなりが起きない。**
   必ず別の弦に置くこと。
   ══════════════════════════════════════════════════════════════ */

const rootHi = ()=> 62 + Math.floor(Math.random()*10);   /* D4〜A4。うなりが速い */

/* ══ さらに高い音域 ══
   うなりの速さは周波数に比例する。1オクターブ上げれば、同じセント数でも
   うなりが倍速くなる。減衰は短くなるが、差し引きで有利。
   **2セントを問えるのは、この高さがあってこそ。**
   D4 では2セントのうなりは2.95秒に1回で、音が消える前に2回数えられない。 */
const rootTop = ()=> 79 + Math.floor(Math.random()*8);   /* G5〜D6 */

/* セントを MIDI の単位へ */
const cent = c => c/100;

/* ズレあり・なしを問う段。同時か連続か、ズレの幅だけが違う */
function makeDetune(cents, together, roots){
  const root = roots();
  const off  = (Math.random() < 0.5) ? 0
             : (Math.random() < 0.5 ? 1 : -1) * cent(pick(cents));
  const same = (off === 0);
  return {
    ask: together ? '2つの音の高さは' : '2つめの音の高さは',
    layout:'plain', fig:'tuner', cents: Math.round(off*100),
    options:['そろっている','ズレている'],
    answer: same ? 'そろっている' : 'ズレている',
    note: same ? 'まったく同じ高さでした'
               : (Math.round(Math.abs(off*100)) + 'セントずれていました'),
    seq: together
      ? [ ev(0, root, 3, 5.0), ev(0, root+off, 2, 5.0) ]
      : [ ev(0, root, 3, 1.8), ev(1.1, root+off, 3, 3.9) ]
  };
}

  { no:6, name:'ズレの向き（きわどい）', hint:'ズレが3〜8セント。高い音域で、向きだけを問います',

/* ══════════════════════════════════════════════════════════════
   上級・題材3〜9

   ══ 和音の作り方 ══
   同時に鳴らす音は必ず別の弦へ置く。同じ弦に重ねると
   「同じ弦を弾けば前の音は止まる」の決まりで消える。
   ごく短くずらして鳴らすのは、実物の弦が同時には鳴らないため。

   ══ 音名当ての基準音 ══
   毎回はじめに C（C4・261.63Hz）を鳴らしてから問う。基準を与える
   ことで、絶対の記憶ではなく基準からの隔たりを聴く稽古になる。

   答えの音は基準の**上下に散らす**。上のオクターブだけに置くと
   答えが必ず基準より高くなり、判断が一方向に偏る。
   C3〜B4、基準の C4 を挟む範囲を使う。
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   メジャースケール — 旋律を扱う最初の足場

   この道具はこれまで、2音か1和音しか扱ってこなかった。旋律の段を
   置くには音階が要る。まずメジャー一本。**「外れている」の意味が
   一意に定まる**からである（7音の外は、どれが鳴っても外れ）。
   ペンタトニックは音が5つしかなく、4度と7度まで外れに数えることに
   なるので、聴き分けの土台には向かない。
   ══════════════════════════════════════════════════════════════ */
const MAJOR = [0, 2, 4, 5, 7, 9, 11];

/* 音階の中を歩く旋律。跳びすぎると形が覚えられない */
function melodyDegrees(n){
  const out = [pick([0, 2, 4])];        /* 主和音の音から始める */
  for(let i = 1; i < n; i++){
    let d, guard = 0;
    do{ d = out[i-1] + pick([-2, -1, 1, 2]); guard++; }
    while((d < 0 || d > 6) && guard < 20);
    out.push(Math.min(6, Math.max(0, d)));
  }
  return out;
}

/* 度の並びを、実際に鳴る音へ。alter を渡すとその1音だけずらす */
function melodyNotes(t0, key, degs, alter){
  return degs.map((d, i)=>
    ev(t0 + i*0.42, key + MAJOR[d] + ((alter && alter.i === i) ? alter.semi : 0), 3, 0.62));
}

const CHORD = {
  'メジャー':[0,4,7],  'マイナー':[0,3,7],
  '7th':[0,4,7,10],    'm7':[0,3,7,10],
  'maj7':[0,4,7,11],   'dim':[0,3,6],
  'aug':[0,4,8],       'sus4':[0,5,7]
};

/* 和音を鳴らす並びにする。弦を分け、ごく短くずらす */
function chordAt(t, root, iv, cut){
  return iv.map((x,k)=> ev(t + k*0.025, root + x, 5-k, cut));
}

/* 転回：最低音を上へ送る */
function invert(iv, n){
  const a = iv.slice();
  for(let i=0;i<n;i++) a.push(a.shift() + 12);
  return a;
}

/* ══════════════════════════════════════════════════════════════
   和音を一定の音域に収める（ボイシング）

   和音を全て基本形のまま key+度数 に置くと、**最低音が度数の数字
   そのままに上下する。** Ⅳは5半音上、Ⅴは7半音上、Ⅵmは9半音上——
   つまり和声を聴かずとも、音の高さを追うだけで並びが判ってしまう。

   転回とオクターブを総当たりし、重心が指定の高さに最も近い形を採る。
   実際の伴奏が、どの和音でも手を大きく動かさずに弾くのと同じ理屈。
   ══════════════════════════════════════════════════════════════ */
function voiced(root, iv, center){
  const cand = [];
  for(let inv = 0; inv < iv.length; inv++){
    const base = invert(iv, inv);
    for(let oc = -24; oc <= 24; oc += 12){
      const notes = base.map(x=> root + x + oc);
      const avg   = notes.reduce((a,b)=> a+b, 0) / notes.length;
      cand.push({ notes:notes, cost:Math.abs(avg - center) });
    }
  }
  cand.sort((a,b)=> a.cost - b.cost);

  /* ══ 最も近い形を必ず採ってはいけない ══
     一つに決めてしまうと、同じ度数には常に同じ転回が当たる。
     すると最低音の動きがそのまま進行の指紋になり、
     **和声を聴かずとも並びが判ってしまう。**
     音域から外れない範囲で、候補の中から毎回選び直す。
     ゆらぎ3.5では、Ⅰ以外から始まる進行で漏れが2割残った。
     4.5まで広げて97%へ。音域は midi 44〜73 に収まる。 */
  const near = cand.filter(c=> c.cost <= cand[0].cost + 4.5);
  return pick(near).notes;
}

/* 高さの決まった和音を鳴らす並びにする */
function chordNotes(t, notes, cut){
  return notes.map((m,k)=> ev(t + k*0.025, m, 5-k, cut));
}

const IVNAME = { 1:'短2', 2:'長2', 3:'短3', 4:'長3', 5:'完4',
                 6:'増4', 7:'完5', 8:'短6', 9:'長6', 10:'短7', 11:'長7', 12:'完8' };

const PITCHNAME = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

/* 音名当ての基準音。C4（中央のド・261.63Hz） */
const REF_C = 60;

/* ══ 音名当ての音域 ══
   C2(36)〜B5(83)。**これ以上下げると音名が取りにくく、稽古が
   「聴き分け」ではなく「勘」になる。** */
const NAME_LO = 36, NAME_HI = 84;   /* 上端の84は C6 ただ一つ。下記の理由で要る */

/* ══ 基準音からの隔たりで分ける ══
   同じ「G」でも、基準音のすぐ上のGと、1オクターヴ半離れたGでは
   耳の仕事がまるで違う。**近ければ隔たりを直に測れるが、遠くなると
   一度オクターヴを畳んでから音名を求めることになる。**
   前者を「1オクターブ以内」、後者を「1オクターブより遠い」として
   段を分ける。

   基準音そのもの（隔たり0）は問えない。同じ音を鳴らして
   「音名は」と訊くことになるため。

   ══ 上端が C6 まで要る理由 ══
   遠い側では、Cの候補が下の帯（36）にしか無い。**1組10問を7つの
   音名に配ると、どれか一つは必ず2度出る。それがCに当たった時、
   同じ問いを二度出すほかなくなる。** C6を一つ足すだけで塞がる。 */
function namePool(semi, near){
  const out = [];
  for(let m = NAME_LO; m <= NAME_HI; m++){
    if((((m % 12) + 12) % 12) !== semi) continue;
    const d = Math.abs(m - REF_C);
    if(d === 0) continue;
    if(near ? (d <= 12) : (d >= 13)) out.push(m);
  }
  return out;
}

/* ══ オクターブ違い ══
   音域から外れぬよう、2音とも C1〜C6 の内に収める。 */
function makeOctave(kinds){
  const k    = pick(kinds);
  const gap  = 12 * k;
  const LO = 36, HI = 88;
  /* 置ける場所を数え上げてから選ぶ。端で潰れると偏りが出る */
  const spots = [];
  for(let a = LO; a <= HI; a++){
    if(a + gap <= HI) spots.push([a, a + gap]);
    if(gap && a - gap >= LO) spots.push([a, a - gap]);
  }
  const [m1, m2] = pick(spots);
  const label = k === 0 ? '同じ高さ' : (k + 'オクターブ');
  return {
    ask:'2つの音の隔たりは', layout:'plain',
    options: kinds.map(x=> x === 0 ? '同じ高さ' : (x + 'オクターブ')),
    answer: label,
    note: k === 0 ? 'まったく同じ高さでした'
                  : (label + '（' + gap + '半音）' + (m2 > m1 ? '上でした' : '下でした')),
    seq:[ ev(0, m1, 3, 1.5), ev(1.1, m2, 3, 3.0) ]
  };
}

/* ══ 移調か、別物か ══ */
function makeTranspose(mode){
  const N     = 4;
  const key1  = 50 + Math.floor(Math.random()*8);
  const key2  = key1 + pick([-5, -4, -3, -2, 2, 3, 4, 5]);   /* 必ず移調する */
  const degs  = melodyDegrees(N);
  const same  = Math.random() < 0.5;

  const degs2 = degs.slice();
  let alter = null, why;
  if(same){
    why = '同じ旋律を' + (key2 > key1 ? '高い' : '低い') + '調へ移しただけでした';
  }else{
    const i = 1 + Math.floor(Math.random() * (N - 1));   /* 出だしは変えない */
    if(mode === 'half'){
      alter = { i:i, semi: pick([-1, 1]) };
      why = (i+1) + '番目の音が半音ずれ、調の外へ出ていました';
    }else{
      let d = degs[i] + pick([-1, 1]);
      if(d < 0) d = 1;
      if(d > 6) d = 5;
      degs2[i] = d;
      why = (i+1) + '番目の音が、音階の中の隣の音へ入れ替わっていました';
    }
  }
  const key = k=> chordNotes(k === 1 ? 0 : 3.0, voiced(key1 + (k === 1 ? 0 : (key2 - key1)),
                                                      CHORD['メジャー'], 52), 1.1);
  return {
    ask:'2度目の旋律は', layout:'plain',
    options:['同じ旋律','ちがう旋律'],
    answer: same ? '同じ旋律' : 'ちがう旋律',
    note: why,
    seq: key(1)
      .concat(melodyNotes(0.9, key1, degs,  null))
      .concat(key(2))
      .concat(melodyNotes(3.9, key2, degs2, alter))
  };
}

/* 白鍵だけ／12音すべて、近い／遠い——4通りの段を1つの型で作る */
function makeName(names, semiOf, near){
  let name, pool = [];
  /* 遠い側では、Cの候補が下の帯にしか無い。空の音名を選んだら引き直す */
  for(let k = 0; k < 40 && !pool.length; k++){
    name = pick(names);
    pool = namePool(semiOf(name), near);
  }
  const midi = pick(pool);
  return {
    ask:'はじめが基準音C。2つめの音名は', layout:'keys',
    options: names.slice(), answer:name,
    note: refNote(midi, name),
    seq:[ ev(0, REF_C, 3, 1.6), ev(1.3, midi, 3, 3.4) ]
  };
}

const WHITE_NAMES = ()=> Object.keys(WHITE);
const ALL_NAMES   = ()=> PITCHNAME.slice();

/* ══ 答えの音は基準音と重ねない ══
   基準と同じ高さの C4 が答えになると、鳴った瞬間に判ってしまい、
   音名を聴き取る稽古にならない。C の時だけ上のオクターブへ逃がす。
   C3 と C5 の二つが残るので、出題の幅は他の音名と変わらない。 */
/* 基準音からの隔たりを言葉にする */
function refNote(midi, name){
  const d = midi - REF_C;
  if(d === 12) return '基準音のちょうど1オクターブ上の ' + name + 'でした';
  if(d === -12)return '基準音のちょうど1オクターブ下の ' + name + 'でした';
  return '基準音Cより ' + Math.abs(d) + '半音' + (d > 0 ? '高い' : '低い') + ' ' + name + 'でした';
}
const WHITE     = { 'C':0, 'D':2, 'E':4, 'F':5, 'G':7, 'A':9, 'B':11 };

/* 度数を問う段。使う度数の一覧だけが違う */
function makeInterval(list, voices){
  const root = rootMid();
  const iv   = pick(list);
  const up   = Math.random() < 0.5;
  const v    = voices ? pickPair() : null;
  return {
    ask:'2つの音の隔たりは',
    layout: list.length > 6 ? 'grid3' : 'plain',
    options: list.map(x=> IVNAME[x]),
    answer: IVNAME[iv],
    note: (up ? '上へ' : '下へ') + iv + '半音'
        + (v ? '（' + voiceLabel(v[0]) + ' → ' + voiceLabel(v[1]) + '）' : ''),
    seq:[ ev(0,   root,                  3, 1.7, v ? v[0] : null),
          ev(0.9, root + (up ? iv : -iv), 3, 3.2, v ? v[1] : null) ]
  };
}

/* ══ 1つめと2つめで違う声を選ぶ ══
   必ず片方をピアノにする。

   ギター同士では音色を分けきれない。弦の作りは1音ずつ変えられるが、
   **アンプの箱鳴りは全弦を混ぜた後に一括で掛かる**ため、後から
   指定した側に1音目まで揃ってしまう。ナイロンの弦でミュートの箱を
   鳴らす、実在しない音になる。

   ピアノはギターの経路を通らず出口へ直に繋がっているので、
   **ピアノとギターの組だけが完全に分けられる。** */
function pickPair(){
  const g = pick(MIXABLE.filter(v=> v.id !== 'piano')).id;
  return (Math.random() < 0.5) ? ['piano', g] : [g, 'piano'];
}

ADV_STAGES.push(

  /* ── 題材3 コードの同一判定 ── */
  /* ══ 積み方は、答えと無関係に振る ══
     以前は「同じコード」の時だけ転回し、「ちがう」側は素の形で鳴らして
     いた。**すると最低音の動きが、そのまま答えの札になる。**
     動かなければ明暗の入れ替え、+3か+4なら同じコード——という具合に、
     和音の正体を聴かずとも9割方あたってしまう。

     いまは両方の和音を voiced() に通し、積み方（転回とオクターヴ）を
     毎回選び直す。最低音がどう動くかは答えと結びつかない。 */
  { no:7, name:'同じコードか', hint:'積み方が変わっていても、正体が同じなら「同じコード」', n:10, ratio:0.9,
    kinds:['同じコード','ちがうコード'],
    make(){
      const root = rootLow();
      const q    = pick(['メジャー','マイナー']);
      const base = CHORD[q];
      const same = Math.random() < 0.5;

      let root2 = root, iv2 = base, why;
      if(same){
        why = '構成音は同じで、積み方だけが変わりました';
      }else if(Math.random() < 0.5){
        /* 移調の量は和音に一つ。音ごとに選ぶと和音ではなく音の塊になる */
        root2 = root + pick([2,5,7,-3]);
        why = '別の根音の和音でした';
      }else{
        iv2 = CHORD[q === 'メジャー' ? 'マイナー' : 'メジャー'];
        why = '根音は同じですが、明暗が入れ替わっていました';
      }

      /* 置きどころも和音ごとに少し振る。固定すると、重心の動きが
         半音単位で決まった値しか取らず、そこから答えが読める */
      const at = ()=> 55 + Math.floor(Math.random()*7);
      const a = voiced(root, base, at());
      let   b = voiced(root2, iv2,  at());
      /* 同じコードの時、まったく同じ形で鳴らせば耳を使わずに判る */
      if(same){
        let guard = 0;
        while(b.join() === a.join() && guard++ < 20) b = voiced(root, base, at());
      }
      return {
        ask:'2つの和音の正体は', layout:'plain',
        options:['同じコード','ちがうコード'],
        answer: same ? '同じコード' : 'ちがうコード',
        note:why,
        seq: chordNotes(0, a, 1.9).concat(chordNotes(1.15, b, 3.4))
      };
    }},
